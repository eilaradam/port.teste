        '</tr></thead><tbody>' +
        lista.slice(0, 400).map(function(e){
          const d = e.criado_em ? new Date(e.criado_em) : null;
          return '<tr>' +
            '<td>' + (d ? String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + ' ' +
                        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') : '·') + '</td>' +
            '<td>' + escapar(e.email) + '</td>' +
            '<td class="corte" title="' + escapar(e.assunto) + '">' + escapar(e.assunto) + '</td>' +
            '<td><span class="pilula p-' + (e.status === 'ok' ? 'cliente' : 'parada') + '">' +
              (e.status === 'ok' ? 'sim' : 'não') + '</span></td>' +
            '<td class="corte" title="' + escapar(e.erro) + '">' + escapar(e.erro || '·') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' +
        '<p style="margin-top:9px;font-size:.78rem;color:var(--apagado)">' + lista.length + ' de ' + dados.envios.length + ' envios.</p>';
    }
    return html + '</div>';
  }

  /* =====================================================================
     ABA 2 · MARCAS
     ===================================================================== */
  /* Os nichos das marcas. São os mesmos nomes usados nos vídeos,
     para o painel inteiro falar a mesma língua.
     As pistas são pedaços de palavra que aparecem no nome, no
     e-mail ou na observação da marca. O casamento é por começo de
     palavra, então "decor" pega "decoração" e "tapete" pega
     "tapetes", mas não pega no meio de outra palavra qualquer. */
  const NICHOS_MARCA = [
    { chave:'beleza', rotulo:'beleza', pistas:[
      'beleza','beauty','cosmetic','skin','derma','make','maquiagem','batom','cabelo','hair',
      'perfum','estetic','salao','unha','nail','cilios','sobrancelha','barbear','capilar','shampoo'] },
    { chave:'casa', rotulo:'casa e decoração', pistas:[
      'casa','decor','tapete','movei','movel','lar ','home','interior','cozinha','utensil','cama',
      'banho','colchao','sofa','ilumin','luminar','jardim','organiza','limpeza','eletrodomestic',
      'porcelan','ceramic','tecido','cortina','marcenar','arquitet'] },
    { chave:'moda', rotulo:'moda', pistas:[
      'moda','fashion','roupa','vestu','boutique','jeans','calcado','sapato','tenis','bolsa',
      'joia','semijoia','acessori','oculos','relogio','biquini','lingerie','brecho','wear','closet','malha'] },
    { chave:'gastronomia', rotulo:'gastronomia', pistas:[
      'restaurant','food','aliment','comida','gastro','padaria','confeit','doceria','bolo','chocolat',
      'pizza','hamburg','acougue','tempero','massa','queijo','congelad','marmita','churrasc','cozinh'] },
    { chave:'drinks', rotulo:'drinks e sobremesas', pistas:[
      'bebida','drink','cerveja','vinho','vinicol','destilar','cachaca','suco','cafeteria','cafe',
      'chopp','adega','sorvet','gelato','acai','energetic'] },
    { chave:'saude', rotulo:'saúde e fitness', pistas:[
      'saude','clinic','medic','odonto','dentist','nutri','fisio','suplement','vitamin','academia',
      'fitness','pilates','psico','farmac','laborator','terapia','whey','creatina','ortoped','vacina'] },
    { chave:'tech', rotulo:'tech e apps', pistas:[
      'tech','tecnolog','digital','software','aplicativ','sistema','eletronic','informatic','celular',
      'computador','notebook','gamer','startup','cloud','robo','smart','automac'] },
    { chave:'financas', rotulo:'finanças', pistas:[
      'banco','financ','invest','credito','cartao','pagament','seguro','contabil','fintech',
      'consorcio','emprest','cripto','maquininha','cobranca'] },
    { chave:'viagem', rotulo:'viagem', pistas:[
      'viagem','turismo','hotel','pousada','hostel','resort','travel','tour','passagem','temporada',
      'camping','mochil','ecoturismo','chale'] },
    { chave:'pet', rotulo:'pet', pistas:[
      'pet','veterinar','racao','aquario','petshop','canil','gatil'] }
  ];

  /* as expressões são montadas uma vez só, senão fica lento
     quando ela manda identificar trezentas marcas de uma vez */
  const PISTAS_PRONTAS = NICHOS_MARCA.map(function(n){
    return {
      chave: n.chave,
      testes: n.pistas.map(function(p){
        return { peso: p.trim().length, exp: new RegExp('(^|[^a-z0-9])' + p.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')) };
      })
    };
  });

  function rotuloNicho(chave){
    if (!chave){ return 'sem nicho'; }
    const n = NICHOS_MARCA.filter(function(x){ return x.chave === chave; })[0];
    return n ? n.rotulo : chave;
  }

  /* olha o nome, o e-mail, o @ e a observação da marca e devolve
     o nicho que teve mais pistas. Sem pista nenhuma, devolve vazio,
     que é mais honesto do que chutar. */
  function adivinharNicho(marca){
    const texto = ' ' + semAcento([marca.nome, marca.email, marca.instagram, marca.obs]
      .filter(Boolean).join(' ')) + ' ';
    let melhor = '', maior = 0;
    PISTAS_PRONTAS.forEach(function(n){
      let soma = 0;
      n.testes.forEach(function(t){ if (t.exp.test(texto)){ soma += t.peso; } });
      if (soma > maior){ maior = soma; melhor = n.chave; }
    });
    return melhor;
  }

  const SITUACOES = [
    { v:'lead',        t:'Lead' },
    { v:'conversando', t:'Conversando' },
    { v:'cliente',     t:'Cliente' },
    { v:'parada',      t:'Parada' }
  ];
  let buscaMarcas = '';
  let filtroSituacao = 'todas';
  let filtroNicho = 'todos';
  let soFavoritas = false;
  let soDoSite = false;

  function desenharMarcas(){
    $('#acaoDaAba').innerHTML =
      '<button class="botao claro" type="button" id="identificarNichos">identificar nichos</button> ' +
      '<button class="botao claro" type="button" id="importarMarcas">importar planilha</button> ' +
      '<button class="botao claro" type="button" id="baixarMarcas">baixar CSV</button> ' +
      '<button class="botao" type="button" id="novaMarca">+ nova marca</button>';

    const lista = dados.marcas.filter(function(m){
      if (soFavoritas && !m.favorita){ return false; }
      if (soDoSite && m.origem !== 'site'){ return false; }
      if (filtroSituacao !== 'todas' && m.situacao !== filtroSituacao){ return false; }
      if (filtroNicho === 'sem' && (m.nicho || '')){ return false; }
      if (filtroNicho !== 'todos' && filtroNicho !== 'sem' && m.nicho !== filtroNicho){ return false; }
      if (!buscaMarcas){ return true; }
      const alvo = semAcento((m.nome||'') + ' ' + (m.instagram||'') + ' ' + (m.email||''));
      return alvo.indexOf(semAcento(buscaMarcas)) >= 0;
    }).sort(function(a,b){
      /* as fixadas sobem para o topo, o resto continua em ordem de nome */
      const fa = a.favorita ? 1 : 0, fb = b.favorita ? 1 : 0;
      if (fa !== fb){ return fb - fa; }
      return semAcento(a.nome) < semAcento(b.nome) ? -1 : (semAcento(a.nome) > semAcento(b.nome) ? 1 : 0);
    });

    const fixadas = dados.marcas.filter(function(m){ return m.favorita; }).length;

    let html = '<div class="barra-ferramentas">' +
      '<input class="busca" id="buscaMarcas" type="search" placeholder="buscar por nome, @ ou e-mail" value="' + escapar(buscaMarcas) + '">' +
      '<button class="chip" type="button" data-sit="todas" aria-pressed="' + (filtroSituacao==='todas') + '">todas</button>' +
      SITUACOES.map(function(s){
        return '<button class="chip" type="button" data-sit="' + s.v + '" aria-pressed="' + (filtroSituacao===s.v) + '">' + s.t + '</button>';
      }).join('') +
      '<button class="chip" type="button" id="soFav" aria-pressed="' + soFavoritas + '">só as fixadas</button>' +
      '<button class="chip" type="button" id="soDoSite" aria-pressed="' + soDoSite + '">vieram do site</button>' +
      '<select id="filtroNicho" class="chip" style="padding-right:26px">' +
        '<option value="todos"' + (filtroNicho==='todos'?' selected':'') + '>todos os nichos</option>' +
        '<option value="sem"' + (filtroNicho==='sem'?' selected':'') + '>sem nicho</option>' +
        NICHOS_MARCA.map(function(n){
          return '<option value="' + escapar(n.chave) + '"' + (filtroNicho===n.chave?' selected':'') + '>' + escapar(n.rotulo) + '</option>';
        }).join('') +
      '</select></div>';

    const selecionadas = dados.marcas.filter(function(m){ return m.selecionada; });
    const daListaComEmail = lista.filter(function(m){ return (m.email || '').trim(); });

    if (selecionadas.length || daListaComEmail.length){
      html += '<div class="barra-selecao">' +
        '<span><b>' + selecionadas.length + '</b> ' +
        (selecionadas.length === 1 ? 'marca selecionada' : 'marcas selecionadas') +
        ' para o disparo</span>' +
        '<span style="flex:1"></span>' +
        '<button class="chip" type="button" id="selecionarVisiveis">selecionar as ' +
          daListaComEmail.length + ' que estão aparecendo</button>' +
        (selecionadas.length ? '<button class="chip" type="button" id="limparSelecao">limpar seleção</button>' : '') +
      '</div>';
    }

    html += '<div class="caixa">';
    if (!dados.marcas.length){
      html += '<p class="vazio">A sua base de contatos está vazia. Clique em "+ nova marca" para cadastrar a primeira, ' +
              'ou espere alguém preencher o formulário do seu portfólio: o contato cai aqui sozinho, como Lead.</p>';
    } else if (!lista.length){
      html += '<p class="vazio">Nenhuma marca com esse filtro. Tente limpar a busca.</p>';
    } else {
      html += '<div class="rolagem"><table><thead><tr>' +
        '<th class="escolher"></th>' +
        '<th style="width:34px"></th>' +
        '<th>marca</th><th>nicho</th><th>instagram</th><th>e-mail</th><th>telefone</th>' +
        '<th>situação</th><th>observação</th><th>último contato</th><th></th>' +
        '</tr></thead><tbody>' +
        lista.map(function(m){
          const tel = String(m.telefone || '').replace(/\D/g,'');
          const arroba = String(m.instagram || '').replace('@','').trim();
          const ultimaFixada = m.favorita && !soFavoritas &&
            lista[lista.indexOf(m) + 1] && !lista[lista.indexOf(m) + 1].favorita;
          const temEmail = !!(m.email || '').trim();
          return '<tr class="clicavel' + (m.favorita ? ' favorita' : '') +
                 (m.selecionada ? ' escolhida' : '') +
                 (ultimaFixada ? ' ultima-fixada' : '') + '" data-marca="' + m.id + '">' +
            '<td class="escolher"><input type="checkbox" data-escolher="' + m.id + '"' +
              (m.selecionada ? ' checked' : '') + (temEmail ? '' : ' disabled') + ' data-parar ' +
              'title="' + (temEmail ? 'incluir no próximo disparo' : 'esta marca não tem e-mail cadastrado') + '" ' +
              'aria-label="incluir no próximo disparo"></td>' +
            '<td><button class="estrela ' + (m.favorita ? 'marcada' : '') + '" type="button" ' +
              'data-fixar="' + m.id + '" data-parar aria-label="' +
              (m.favorita ? 'Tirar do topo' : 'Fixar no topo') + '" title="' +
              (m.favorita ? 'fixada no topo, clique para soltar' : 'clique para fixar no topo') + '">' +
              '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>' +
            '</button></td>' +
            '<td><strong>' + escapar(m.nome || 'sem nome') + '</strong></td>' +
            '<td>' + (m.nicho
              ? '<span class="pilula p-nicho">' + escapar(rotuloNicho(m.nicho)) + '</span>'
              : '<span class="pilula p-vazio">sem nicho</span>') + '</td>' +
            '<td>' + (arroba ? '<a href="https://instagram.com/' + escapar(arroba) + '" target="_blank" rel="noopener" data-parar>@' + escapar(arroba) + '</a>' : '<span style="color:var(--apagado)">·</span>') + '</td>' +
            '<td>' + escapar(m.email || '') + '</td>' +
            '<td>' + escapar(m.telefone || '') + '</td>' +
            '<td><span class="pilula p-' + escapar(m.situacao || 'lead') + '">' + escapar(rotuloSituacao(m.situacao)) + '</span></td>' +
            '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapar(m.obs || '') + '</td>' +
            '<td>' + (m.ultimo_contato ? escapar(dataCurta(m.ultimo_contato)) : '<span style="color:var(--apagado)">·</span>') + '</td>' +
            '<td class="acoes">' +
              (tel ? '<a class="mini" href="https://wa.me/' + (tel.length <= 11 ? '55' + tel : tel) + '" target="_blank" rel="noopener" data-parar aria-label="Abrir o WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/><path d="M8.5 9.5c0 3 2.5 5.5 5.5 5.5"/></svg></a>' : '') +
              '<button class="mini perigo" type="button" data-apagar-marca="' + m.id + '" data-parar aria-label="Apagar"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>' +
            '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p style="margin-top:10px;font-size:.78rem;color:var(--apagado)">' +
          lista.length + ' de ' + dados.marcas.length + ' marcas' +
          (fixadas ? ' · ' + fixadas + (fixadas === 1 ? ' fixada no topo' : ' fixadas no topo') : '') +
          '. Clique na linha para editar, ou na estrela para fixar.</p>';
    }
    html += '</div>';

    $('#painel').innerHTML = html;

    $('#novaMarca').addEventListener('click', function(){ formMarca(null); });
    $('#baixarMarcas').addEventListener('click', function(){ baixarCSV('marcas', lista); });
    $('#importarMarcas').addEventListener('click', janelaImportar);
    $('#identificarNichos').addEventListener('click', janelaNichos);
    const busca = $('#buscaMarcas');
    busca.addEventListener('input', function(){
      buscaMarcas = busca.value;
      const pos = busca.selectionStart;
      desenharMarcas();
      const nova = $('#buscaMarcas');
      nova.focus();
      try{ nova.setSelectionRange(pos, pos); }catch(e){}
    });
    $$('[data-sit]').forEach(function(b){
      b.addEventListener('click', function(){ filtroSituacao = b.dataset.sit; desenharMarcas(); });
    });
    $('#filtroNicho').addEventListener('change', function(){
      filtroNicho = $('#filtroNicho').value;
      desenharMarcas();
    });
    $('#soFav').addEventListener('click', function(){ soFavoritas = !soFavoritas; desenharMarcas(); });
    $('#soDoSite').addEventListener('click', function(){ soDoSite = !soDoSite; desenharMarcas(); });
    $$('[data-marca]').forEach(function(tr){
      tr.addEventListener('click', function(ev){
        if (ev.target.closest('[data-parar]')){ return; }
        const m = dados.marcas.filter(function(x){ return String(x.id) === tr.dataset.marca; })[0];
        formMarca(m);
      });
    });
    /* a caixinha grava na hora, então a seleção sobrevive a
       fechar o painel e voltar amanhã */
    $$('[data-escolher]').forEach(function(ck){
      ck.addEventListener('click', function(ev){ ev.stopPropagation(); });
      ck.addEventListener('change', async function(){
        const m = dados.marcas.filter(function(x){ return String(x.id) === ck.dataset.escolher; })[0];
        if (!m){ return; }
        const novo = ck.checked;
        const r = await gravar('marcas', { id:m.id, selecionada:novo });
        if (r.ok){
          m.selecionada = novo;
          const tr = ck.closest('tr');
          if (tr){ tr.classList.toggle('escolhida', novo); }
          const barra = $('.barra-selecao b');
          if (barra){ barra.textContent = dados.marcas.filter(function(x){ return x.selecionada; }).length; }
        } else {
          ck.checked = !novo;
        }
      });
    });

    const btnTodas = $('#selecionarVisiveis');
    if (btnTodas){
      btnTodas.addEventListener('click', async function(){
        const alvo = daListaComEmail.filter(function(m){ return !m.selecionada; });
        if (!alvo.length){ avisinho('Todas as que estão aparecendo já estão selecionadas.'); return; }
        btnTodas.disabled = true;
        btnTodas.textContent = 'selecionando...';
        await mudarSelecao(alvo, true);
        desenharMarcas();
      });
    }
    const btnLimpar = $('#limparSelecao');
    if (btnLimpar){
      btnLimpar.addEventListener('click', function(){
        const alvo = dados.marcas.filter(function(m){ return m.selecionada; });
        confirmar('Limpar a seleção de ' + alvo.length + (alvo.length === 1 ? ' marca' : ' marcas') + '?', async function(){
          await mudarSelecao(alvo, false);
          desenharMarcas();
        });
      });
    }

    $$('[data-fixar]').forEach(function(b){
      b.addEventListener('click', async function(ev){
        ev.stopPropagation();
        const m = dados.marcas.filter(function(x){ return String(x.id) === b.dataset.fixar; })[0];
        if (!m){ return; }
        const novo = !m.favorita;
        const r = await gravar('marcas', { id:m.id, favorita:novo });
        if (r.ok){
          m.favorita = novo;
          avisinho(novo ? 'Fixada no topo.' : 'Solta do topo.');
          desenharMarcas();
        }
      });
    });
    $$('[data-apagar-marca]').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        const m = dados.marcas.filter(function(x){ return String(x.id) === b.dataset.apagarMarca; })[0];
        if (!m){ return; }
        confirmar('Apagar ' + (m.nome || 'esta marca') + ' da sua base?', async function(){
          if (await apagar('marcas', m.id)){
            dados.marcas = dados.marcas.filter(function(x){ return x.id !== m.id; });
            avisinho('Marca apagada.');
            desenharMarcas();
          }
        });
      });
    });
  }

  /* muda a seleção de várias marcas de uma vez, em lotes, para
     não abrir trezentas conversas com o banco ao mesmo tempo */
  async function mudarSelecao(marcas, valor){
    const pedaco = 25;
    let erros = 0;
    for (let i = 0; i < marcas.length; i += pedaco){
      const lote = marcas.slice(i, i + pedaco);
      await Promise.all(lote.map(function(m){
        return sb.from('marcas').update({ selecionada: valor }).eq('id', m.id)
          .then(function(r){
            if (r.error){ erros++; return; }
            m.selecionada = valor;
          }, function(){ erros++; });
      }));
    }
    if (erros){
      avisinho('Não consegui salvar ' + erros + '. Se a coluna selecionada ainda não existe, rode o disparo.sql.');
    } else {
      avisinho(valor ? 'Marcas selecionadas.' : 'Seleção limpa.');
    }
  }

  function rotuloSituacao(v){
    const s = SITUACOES.filter(function(x){ return x.v === v; })[0];
    return s ? s.t : 'Lead';
  }

  function formMarca(m){
    const novo = !m;
    m = m || { nome:'', instagram:'', email:'', telefone:'', situacao:'lead', obs:'', ultimo_contato:'', nicho:'' };
    const fundo = abrirJanela(novo ? 'Nova marca' : 'Editar marca',
      '<form id="formMarca">' +
        '<div class="dupla">' +
          campoTexto('mNome','marca', m.nome) +
          campoLista('mNicho','nicho', m.nicho || '',
            [{ v:'', t:'sem nicho' }].concat(NICHOS_MARCA.map(function(n){ return { v:n.chave, t:n.rotulo }; }))) +
        '</div>' +
        '<div class="dupla">' + campoTexto('mInsta','instagram', m.instagram) + campoTexto('mTel','telefone', m.telefone) + '</div>' +
        campoTexto('mEmail','e-mail', m.email, 'email') +
        '<div class="dupla">' +
          campoLista('mSituacao','situação', m.situacao, SITUACOES) +
          campoTexto('mContato','último contato', m.ultimo_contato ? String(m.ultimo_contato).slice(0,10) : '', 'date') +
        '</div>' +
        campoArea('mObs','observação', m.obs) +
        pe(novo ? 'Adicionar' : 'Salvar') +
      '</form>');

    $('#formMarca', fundo).addEventListener('submit', async function(ev){
      ev.preventDefault();
      const registro = {
        nome: $('#mNome').value.trim(),
        nicho: $('#mNicho').value,
        instagram: $('#mInsta').value.trim(),
        email: $('#mEmail').value.trim(),
        telefone: $('#mTel').value.trim(),
        situacao: $('#mSituacao').value,
        obs: $('#mObs').value.trim(),
        ultimo_contato: $('#mContato').value || null
      };
      if (!novo){ registro.id = m.id; }
      const r = await gravar('marcas', registro);
      if (!r.ok){ return; }
      if (novo && r.linha){ dados.marcas.push(r.linha); }
      else { Object.assign(m, registro); }
      fecharJanela();
      avisinho(novo ? 'Marca adicionada.' : 'Marca salva.');
      desenharMarcas();
    });
  }

  /* =====================================================================
     IDENTIFICAR O NICHO DE CADA MARCA
     Ele lê o nome, o e-mail, o @ e a observação e sugere um nicho.
     Nada é gravado sem você conferir e confirmar.
     ===================================================================== */
  function janelaNichos(){
    const fundo = abrirJanela('Identificar o nicho das marcas', '<div id="passoNichos"></div>', true);
    $('.janela', fundo).classList.add('muito-larga');

    const semNicho = dados.marcas.filter(function(m){ return !(m.nicho || '').trim(); });
    const sugestoes = semNicho.map(function(m){
      return { marca: m, sugerido: adivinharNicho(m) };
    });
    const comPalpite = sugestoes.filter(function(x){ return x.sugerido; });
    const escolhas = {};
    comPalpite.forEach(function(x){ escolhas[x.marca.id] = x.sugerido; });
    const fora = {};

    function desenhar(){
      if (!dados.marcas.length){
        $('#passoNichos', fundo).innerHTML =
          '<p class="vazio">A sua base ainda está vazia. Importe a planilha primeiro.</p>' +
          '<div class="janela-pe"><button class="botao" type="button" data-fechar>fechar</button></div>';
        $$('[data-fechar]', fundo).forEach(function(b){ b.addEventListener('click', fecharJanela); });
        return;
      }

      const jaTem = dados.marcas.length - semNicho.length;
      const semPalpite = semNicho.length - comPalpite.length;

      let html = '<p style="font-size:.88rem;margin-bottom:4px">' +
        'Olhei o nome, o e-mail, o @ e a observação de cada marca. ' +
        'Consegui sugerir nicho para <b>' + comPalpite.length + '</b> ' +
        (comPalpite.length === 1 ? 'marca' : 'marcas') + '.</p>' +
        '<p style="font-size:.79rem;color:var(--apagado);margin-bottom:14px">' +
        jaTem + ' já ' + (jaTem === 1 ? 'tinha' : 'tinham') + ' nicho e ' +
        (jaTem === 1 ? 'não é tocada' : 'não são tocadas') + '. ' +
        semPalpite + ' ' + (semPalpite === 1 ? 'ficou sem palpite' : 'ficaram sem palpite') +
        ', porque o nome não dá pista nenhuma. Essas você marca na mão depois, ' +
        'usando o filtro "sem nicho" na lista.</p>';

      if (!comPalpite.length){
        html += '<p class="vazio">Não consegui adivinhar o nicho de nenhuma marca pelo nome. ' +
          'Você pode definir na mão abrindo cada marca, ou acrescentar uma coluna de nicho na sua planilha e importar de novo.</p>';
      } else {
        html += '<div class="planilha-previa"><table><thead><tr>' +
          '<th class="marcar"></th><th class="num">#</th><th>marca</th>' +
          '<th>o que me fez achar isso</th><th>nicho sugerido</th>' +
          '</tr></thead><tbody>' +
          comPalpite.map(function(x, i){
            const id = x.marca.id;
            return '<tr class="' + (fora[id] ? 'fora' : '') + '">' +
              '<td class="marcar"><input type="checkbox" data-nicho-linha="' + id + '"' +
                (fora[id] ? '' : ' checked') + ' aria-label="aplicar nesta marca"></td>' +
              '<td class="num">' + (i+1) + '</td>' +
              '<td><strong>' + escapar(x.marca.nome || 'sem nome') + '</strong></td>' +
              '<td class="corte" title="' + escapar([x.marca.email, x.marca.obs].filter(Boolean).join(' · ')) + '">' +
                escapar([x.marca.email, x.marca.obs].filter(Boolean).join(' · ') || '·') + '</td>' +
              '<td><select data-nicho-de="' + id + '">' +
                NICHOS_MARCA.map(function(n){
                  return '<option value="' + escapar(n.chave) + '"' +
                    (escolhas[id] === n.chave ? ' selected' : '') + '>' + escapar(n.rotulo) + '</option>';
                }).join('') +
              '</select></td></tr>';
          }).join('') + '</tbody></table></div>';
      }

      const quantas = comPalpite.filter(function(x){ return !fora[x.marca.id]; }).length;
      html += '<div class="janela-pe">' +
        '<button class="botao claro" type="button" data-fechar>cancelar</button>' +
        '<button class="botao" type="button" id="aplicarNichos"' + (quantas ? '' : ' disabled') + '>' +
        'aplicar em <span id="quantasNichos">' + quantas + '</span> marcas</button></div>';

      $('#passoNichos', fundo).innerHTML = html;
      $$('[data-fechar]', fundo).forEach(function(b){ b.addEventListener('click', fecharJanela); });

      function atualizarConta(){
        const escolhidas = comPalpite.filter(function(x){ return !fora[x.marca.id]; });
        const alvo = $('#quantasNichos', fundo);
        if (alvo){ alvo.textContent = escolhidas.length; }
        const b = $('#aplicarNichos', fundo);
        if (b){ b.disabled = escolhidas.length === 0; }
        return escolhidas;
      }

      $$('[data-nicho-linha]', fundo).forEach(function(ck){
        ck.addEventListener('change', function(){
          const id = ck.dataset.nichoLinha;
          if (ck.checked){ delete fora[id]; } else { fora[id] = true; }
          const tr = ck.closest('tr');
          if (tr){ tr.classList.toggle('fora', !ck.checked); }
          atualizarConta();
        });
      });
      $$('[data-nicho-de]', fundo).forEach(function(sel){
        sel.addEventListener('change', function(){ escolhas[sel.dataset.nichoDe] = sel.value; });
      });

      const aplicar = $('#aplicarNichos', fundo);
      if (aplicar){
        aplicar.addEventListener('click', function(){
          const escolhidas = atualizarConta();
          if (escolhidas.length){ aplicarNichos(fundo, escolhidas, escolhas); }
        });
      }
    }

    desenhar();
  }

  async function aplicarNichos(fundo, escolhidas, escolhas){
    $('#passoNichos', fundo).innerHTML =
      '<p style="font-size:.9rem">Gravando os nichos, um pedaço por vez.</p>' +
      '<p id="andaNicho" style="font-size:.85rem;color:var(--tinta-suave);margin-top:8px">0 de ' + escolhidas.length + '</p>' +
      '<div class="trilho" style="margin-top:10px"><div class="cheio" id="barraNicho" style="width:0%"></div></div>';

    const pedaco = 20;
    let feitas = 0, falharam = 0;

    for (let i = 0; i < escolhidas.length; i += pedaco){
      const lote = escolhidas.slice(i, i + pedaco);
      const respostas = await Promise.all(lote.map(function(x){
        const nicho = escolhas[x.marca.id];
        return sb.from('marcas').update({ nicho: nicho }).eq('id', x.marca.id)
          .then(function(r){
            if (r.error){ return false; }
            x.marca.nicho = nicho;
            return true;
          }, function(){ return false; });
      }));
      respostas.forEach(function(ok){ if (ok){ feitas++; } else { falharam++; } });

      const total = Math.min(i + pedaco, escolhidas.length);
      $('#andaNicho', fundo).textContent = total + ' de ' + escolhidas.length;
      $('#barraNicho', fundo).style.width = Math.round((total / escolhidas.length) * 100) + '%';
    }

    let fim = '<p style="font-size:.95rem;font-weight:800;margin-bottom:6px">Pronto.</p>' +
      '<p style="font-size:.88rem"><b>' + feitas + '</b> ' +
      (feitas === 1 ? 'marca ganhou' : 'marcas ganharam') + ' nicho.</p>';
    if (falharam){
      fim += '<p class="tr-dica" style="margin-top:10px">' + falharam + ' não ' +
        (falharam === 1 ? 'entrou' : 'entraram') + '. Se a coluna de nicho ainda não existe no banco, ' +
        'rode no Supabase: alter table public.marcas add column if not exists nicho text not null default \'\';</p>';
    }
    fim += '<div class="janela-pe"><button class="botao" type="button" data-fechar>fechar</button></div>';
    $('#passoNichos', fundo).innerHTML = fim;
    $$('[data-fechar]', fundo).forEach(function(b){ b.addEventListener('click', fecharJanela); });

    avisinho(feitas + ' marcas com nicho.');
    desenharMarcas();
  }

  /* =====================================================================
     IMPORTAR PLANILHA DE LEADS
     Aguenta CSV salvo pelo Excel, pelo Google Planilhas, e também
     colar direto as células copiadas da planilha aberta.
     ===================================================================== */

  /* descobre sozinho se a planilha separa por ponto e vírgula,
     por vírgula ou por tabulação, olhando a primeira linha */
  function descobrirSeparador(texto){
    const primeira = String(texto).split(/\r?\n/)[0] || '';
    const contas = { ';':0, ',':0, '\t':0 };
    let dentroDeAspas = false;
    for (let i = 0; i < primeira.length; i++){
      const c = primeira[i];
      if (c === '"'){ dentroDeAspas = !dentroDeAspas; continue; }
      if (!dentroDeAspas && contas[c] !== undefined){ contas[c]++; }
    }
    let melhor = ',', maior = 0;
    Object.keys(contas).forEach(function(sep){ if (contas[sep] > maior){ maior = contas[sep]; melhor = sep; } });
    return melhor;
  }

  /* transforma o texto da planilha em linhas e colunas.
     Respeita campo entre aspas, com separador e quebra de linha
     dentro, e tira o marcador invisível que o Excel põe no começo. */
  function lerPlanilha(texto){
    texto = String(texto || '').replace(/^\uFEFF/, '');
    const separador = descobrirSeparador(texto);
    const linhas = [];
    let campo = '', linha = [], dentroDeAspas = false;

    for (let i = 0; i < texto.length; i++){
      const c = texto[i];
      if (dentroDeAspas){
        if (c === '"'){
          if (texto[i+1] === '"'){ campo += '"'; i++; }
          else { dentroDeAspas = false; }
        } else { campo += c; }
        continue;
      }
      if (c === '"'){ dentroDeAspas = true; continue; }
      if (c === separador){ linha.push(campo); campo = ''; continue; }
      if (c === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; continue; }
      if (c === '\r'){ continue; }
      campo += c;
    }
    if (campo !== '' || linha.length){ linha.push(campo); linhas.push(linha); }

    return linhas.filter(function(l){
      return l.some(function(c){ return String(c).trim() !== ''; });
    });
  }

  /* os campos da tabela marcas e as palavras que costumam
     aparecer no cabeçalho de uma planilha para cada um deles */
  const CAMPOS_MARCA = [
    { chave:'nome',           rotulo:'marca',           pistas:['marca','nome','empresa','cliente','fantasia','razao social'] },
    { chave:'instagram',      rotulo:'instagram',       pistas:['instagram','insta','arroba','perfil','usuario','handle'] },
    { chave:'email',          rotulo:'e-mail',          pistas:['email','e mail','mail','correio'] },
    { chave:'telefone',       rotulo:'telefone',        pistas:['telefone','whatsapp','whats','celular','fone','tel','zap'] },
    { chave:'situacao',       rotulo:'situação',        pistas:['situacao','status','etapa','estagio','fase'] },
    { chave:'nicho',          rotulo:'nicho',           pistas:['nicho','segmento','categoria','ramo','area','tipo'] },
    { chave:'obs',            rotulo:'observação',      pistas:['obs','observacao','anotacao','nota','comentario','descricao','detalhe'] },
    { chave:'ultimo_contato', rotulo:'último contato',  pistas:['ultimo contato','ultimo retorno','data do contato','data'] }
  ];

  function limparCabecalho(t){
    return semAcento(t).replace(/[^a-z0-9]+/g, ' ').trim();
  }

  /* dá nota para cada combinação de coluna e campo, e fica com as
     melhores, sem deixar duas colunas caírem no mesmo campo */
  function adivinharColunas(cabecalho){
    const limpos = cabecalho.map(limparCabecalho);
    const notas = [];
    CAMPOS_MARCA.forEach(function(campo){
      limpos.forEach(function(titulo, i){
        if (!titulo){ return; }
        let nota = 0;
        campo.pistas.forEach(function(pista){
          if (titulo === pista){ nota = Math.max(nota, 3); }
          else if (titulo.indexOf(pista) === 0){ nota = Math.max(nota, 2); }
          else if (titulo.indexOf(pista) > 0){ nota = Math.max(nota, 1); }
        });
        if (nota > 0){ notas.push({ campo: campo.chave, coluna: i, nota: nota }); }
      });
    });
    notas.sort(function(a,b){ return b.nota - a.nota; });

    const escolha = {};
    const colunasUsadas = {};
    notas.forEach(function(n){
      if (escolha[n.campo] !== undefined || colunasUsadas[n.coluna]){ return; }
      escolha[n.campo] = n.coluna;
      colunasUsadas[n.coluna] = true;
    });
    return escolha;
  }

  /* arruma o que vem da planilha para o formato da tabela */
  /* o que vier escrito na coluna de nicho da planilha é comparado
     com os nichos que a gente já usa, sem depender de acento */
  function nichoNormal(v){
    const t = semAcento(v).trim();
    if (!t){ return ''; }
    const achado = NICHOS_MARCA.filter(function(n){
      return semAcento(n.chave) === t || semAcento(n.rotulo) === t ||
             t.indexOf(semAcento(n.chave)) >= 0;
    })[0];
    return achado ? achado.chave : '';
  }

  function situacaoNormal(v){
    const t = semAcento(v);
    if (!t){ return 'lead'; }
    if (t.indexOf('client') >= 0 || t.indexOf('fechad') >= 0 || t.indexOf('ganho') >= 0){ return 'cliente'; }
    if (t.indexOf('convers') >= 0 || t.indexOf('negoci') >= 0 || t.indexOf('andamento') >= 0 ||
        t.indexOf('proposta') >= 0 || t.indexOf('respond') >= 0){ return 'conversando'; }
    if (t.indexOf('parad') >= 0 || t.indexOf('perdid') >= 0 || t.indexOf('frio') >= 0 ||
        t.indexOf('recus') >= 0 || t.indexOf('sem retorno') >= 0 || t.indexOf('encerrad') >= 0){ return 'parada'; }
    return 'lead';
  }

  function dataNormal(v){
    const t = String(v || '').trim();
    if (!t){ return null; }
    let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m){ return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0'); }
    m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (m){
      let ano = m[3];
      if (ano.length === 2){ ano = '20' + ano; }
      return ano + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
    }
    return null;
  }

  function instagramNormal(v){
    let t = String(v || '').trim();
    if (!t){ return ''; }
    t = t.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '')
         .replace(/[?\/].*$/, '')
         .replace(/^@+/, '')
         .trim();
    return t ? '@' + t : '';
  }

  /* lê o arquivo. Se vier com acento quebrado, que é o caso de
     planilha antiga do Excel, lê de novo no formato antigo. */
  function lerArquivo(arquivo, aoTerminar){
    const leitor = new FileReader();
    leitor.onerror = function(){ avisinho('Não consegui abrir esse arquivo.'); };
    leitor.onload = function(){
      const texto = String(leitor.result || '');
      if (texto.indexOf('\uFFFD') >= 0){
        const leitor2 = new FileReader();
        leitor2.onload = function(){ aoTerminar(String(leitor2.result || '')); };
        leitor2.onerror = function(){ aoTerminar(texto); };
        leitor2.readAsText(arquivo, 'ISO-8859-1');
        return;
      }
      aoTerminar(texto);
    };
    leitor.readAsText(arquivo, 'UTF-8');
  }

  function janelaImportar(){
    const fundo = abrirJanela('Importar a sua planilha de leads', '<div id="passoImportar"></div>', true);
    $('.janela', fundo).classList.add('muito-larga');
    passoEscolherArquivo(fundo);
  }

  function passoEscolherArquivo(fundo){
    $('#passoImportar', fundo).innerHTML =
      '<p style="font-size:.88rem;color:var(--tinta-suave);margin-bottom:14px">' +
      'Traga a sua planilha de duas formas, a que for mais fácil para você.</p>' +

      '<div class="caixa" style="margin-bottom:12px">' +
        '<p class="caixa-titulo">jeito 1 · mandar o arquivo</p>' +
        '<input type="file" id="arquivoPlanilha" accept=".csv,.txt,text/csv,text/plain" style="font-size:.85rem">' +
        '<p style="font-size:.78rem;color:var(--apagado);margin-top:8px">' +
        'Se a sua planilha for do Excel ou do Google Planilhas, use Arquivo, Baixar, e escolha CSV.</p>' +
      '</div>' +

      '<div class="caixa" style="margin-bottom:0">' +
        '<p class="caixa-titulo">jeito 2 · colar direto da planilha</p>' +
        '<textarea class="transcricao" id="coladoPlanilha" style="min-height:130px" ' +
        'placeholder="Abra a sua planilha, selecione as células com o cabeçalho junto, copie e cole aqui."></textarea>' +
        '<button class="botao" type="button" id="lerColado" style="margin-top:10px">ler o que eu colei</button>' +
      '</div>';

    $('#arquivoPlanilha', fundo).addEventListener('change', function(ev){
      const arquivo = ev.target.files && ev.target.files[0];
      if (!arquivo){ return; }
      lerArquivo(arquivo, function(texto){ passoConferir(fundo, texto); });
    });
    $('#lerColado', fundo).addEventListener('click', function(){
      const texto = $('#coladoPlanilha', fundo).value;
      if (!texto.trim()){ avisinho('Cole a planilha no campo primeiro.'); return; }
      passoConferir(fundo, texto);
    });
  }

  function passoConferir(fundo, texto){
    const linhas = lerPlanilha(texto);
    if (linhas.length < 2){
      $('#passoImportar', fundo).innerHTML =
        '<p class="vazio">Só consegui ler ' + linhas.length + ' linha nessa planilha. ' +
        'Confira se ela tem uma linha de cabeçalho e pelo menos uma marca embaixo.</p>' +
        '<div class="janela-pe"><button class="botao claro" type="button" id="voltarEscolher">tentar de novo</button></div>';
      $('#voltarEscolher', fundo).addEventListener('click', function(){ passoEscolherArquivo(fundo); });
      return;
    }

    const cabecalho = linhas[0].map(function(c){ return String(c).trim(); });
    const corpo = linhas.slice(1);
    let mapa = adivinharColunas(cabecalho);
    let desmarcadas = {};

    function desenharConferencia(){
      const opcoesColuna = [{ v:'', t:'não importar' }].concat(cabecalho.map(function(c,i){
        return { v:String(i), t:(c || 'coluna ' + (i+1)) };
      }));

      let html = '<p style="font-size:.88rem;margin-bottom:4px">' +
        'Li <b>' + corpo.length + '</b> ' + (corpo.length === 1 ? 'linha' : 'linhas') + ' na sua planilha. ' +
        'Confira se eu adivinhei as colunas certas e corrija o que estiver trocado.</p>' +
        '<p style="font-size:.78rem;color:var(--apagado);margin-bottom:14px">' +
        'A primeira linha foi tratada como cabeçalho.</p>';

      html += CAMPOS_MARCA.map(function(campo){
        const atual = mapa[campo.chave] === undefined ? '' : String(mapa[campo.chave]);
        return '<div class="campo" style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;margin-bottom:8px">' +
          '<label for="de-' + campo.chave + '" style="margin:0">' + escapar(campo.rotulo) + '</label>' +
          '<select id="de-' + campo.chave + '" data-campo="' + campo.chave + '">' +
            opcoesColuna.map(function(o){
              return '<option value="' + escapar(o.v) + '"' + (o.v === atual ? ' selected' : '') + '>' + escapar(o.t) + '</option>';
            }).join('') +
          '</select></div>';
      }).join('');

      const prontas = montarMarcas(corpo, mapa);
      const novas = prontas.filter(function(x){ return !x.repetida; });
      const repetidas = prontas.length - novas.length;

      html += '<div class="caixa" style="margin-top:14px">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +
          '<p class="caixa-titulo" style="margin:0">confira linha por linha antes de importar</p>' +
          '<span style="flex:1"></span>' +
          '<button class="chip" type="button" id="marcarTodas">marcar todas</button>' +
          '<button class="chip" type="button" id="desmarcarTodas">desmarcar todas</button>' +
        '</div>';

      if (!prontas.length){
        html += '<p class="vazio">Nenhuma linha aproveitável. Confira se a coluna da marca está apontada certo.</p>';
      } else {
        html += '<div class="planilha-previa"><table><thead><tr>' +
          '<th class="marcar"></th><th class="num">#</th>' +

          (repetidas === 1 ? 'entra' : 'entram') + ' de novo para não duplicar.</p>';
      }

      const quantasVao = novas.filter(function(_m, i){ return !desmarcadas[prontas.indexOf(_m)]; }).length;
      html += '<div class="janela-pe">' +
        '<button class="botao claro" type="button" id="voltarEscolher">voltar</button>' +
        '<button class="botao" type="button" id="confirmarImportar"' + (quantasVao ? '' : ' disabled') + '>' +
        'importar <span id="quantasVao">' + quantasVao + '</span> marcas</button></div>';

      $('#passoImportar', fundo).innerHTML = html;

      $$('[data-campo]', fundo).forEach(function(sel){
        sel.addEventListener('change', function(){
          const valor = sel.value;
          Object.keys(mapa).forEach(function(k){
            if (k !== sel.dataset.campo && String(mapa[k]) === valor && valor !== ''){ delete mapa[k]; }
          });
          if (valor === ''){ delete mapa[sel.dataset.campo]; }
          else { mapa[sel.dataset.campo] = Number(valor); }
          desmarcadas = {};
          desenharConferencia();
        });
      });
      $('#voltarEscolher', fundo).addEventListener('click', function(){ passoEscolherArquivo(fundo); });

      /* marcar e desmarcar não redesenha a tabela inteira, senão a
         rolagem volta para o começo a cada clique */
      function atualizarConta(){
        const escolhidas = prontas.filter(function(m, i){ return !m.repetida && !desmarcadas[i]; });
        const alvo = $('#quantasVao', fundo);
        if (alvo){ alvo.textContent = escolhidas.length; }
        const b = $('#confirmarImportar', fundo);
        if (b){ b.disabled = escolhidas.length === 0; }
        return escolhidas;
      }

      $$('[data-linha]', fundo).forEach(function(ck){
        ck.addEventListener('change', function(){
          const i = Number(ck.dataset.linha);
          if (ck.checked){ delete desmarcadas[i]; } else { desmarcadas[i] = true; }
          const tr = ck.closest('tr');
          if (tr){ tr.classList.toggle('fora', !ck.checked); }
          atualizarConta();
        });
      });

      $('#marcarTodas', fundo).addEventListener('click', function(){
        desmarcadas = {};
        desenharConferencia();
      });
      $('#desmarcarTodas', fundo).addEventListener('click', function(){
        prontas.forEach(function(m, i){ if (!m.repetida){ desmarcadas[i] = true; } });
        desenharConferencia();
      });

      const botao = $('#confirmarImportar', fundo);
      if (botao){
        botao.addEventListener('click', function(){
          const escolhidas = atualizarConta();
          if (escolhidas.length){ passoImportar(fundo, escolhidas); }
        });
      }
    }

    desenharConferencia();
  }

  /* monta as marcas prontas para o banco e marca as repetidas */
  function montarMarcas(corpo, mapa){
    const jaTem = { email:{}, instagram:{}, nome:{} };
    dados.marcas.forEach(function(m){
      if (m.email){ jaTem.email[semAcento(m.email)] = true; }
      if (m.instagram){ jaTem.instagram[semAcento(m.instagram).replace('@','')] = true; }
      if (m.nome){ jaTem.nome[semAcento(m.nome)] = true; }
    });

    function pegar(linha, campo){
      const i = mapa[campo];
      if (i === undefined){ return ''; }
      return String(linha[i] === undefined ? '' : linha[i]).trim();
    }

    return corpo.map(function(linha){
      const nome = pegar(linha, 'nome');
      const instagram = instagramNormal(pegar(linha, 'instagram'));
      const email = pegar(linha, 'email');
      const marca = {
        nome: nome,
        nicho: nichoNormal(pegar(linha, 'nicho')),
        instagram: instagram,
        email: email,
        telefone: pegar(linha, 'telefone'),
        situacao: situacaoNormal(pegar(linha, 'situacao')),
        obs: pegar(linha, 'obs'),
        ultimo_contato: dataNormal(pegar(linha, 'ultimo_contato'))
      };
      const chaveEmail = semAcento(email);
      const chaveInsta = semAcento(instagram).replace('@','');
      const chaveNome = semAcento(nome);
      marca.repetida = !!(
        (chaveEmail && jaTem.email[chaveEmail]) ||
        (chaveInsta && jaTem.instagram[chaveInsta]) ||
        (chaveNome && jaTem.nome[chaveNome])
      );
      /* o que entrar agora também conta como já existente, para a
         própria planilha não duplicar dentro dela mesma */
      if (!marca.repetida){
        if (chaveEmail){ jaTem.email[chaveEmail] = true; }
        if (chaveInsta){ jaTem.instagram[chaveInsta] = true; }
        if (chaveNome){ jaTem.nome[chaveNome] = true; }
      }
      return marca;
    }).filter(function(m){
      /* linha sem nome, sem e-mail e sem @ não serve para nada */
      return m.nome || m.email || m.instagram;
    });
  }

  async function passoImportar(fundo, novas){
    $('#passoImportar', fundo).innerHTML =
      '<p style="font-size:.9rem">Mandando para o banco, um pedaço por vez.</p>' +
      '<p id="andamento" style="font-size:.85rem;color:var(--tinta-suave);margin-top:8px">0 de ' + novas.length + '</p>' +
      '<div class="trilho" style="margin-top:10px"><div class="cheio" id="barraImport" style="width:0%"></div></div>';

    const pedaco = 50;
    let entraram = 0, falharam = 0;

    for (let i = 0; i < novas.length; i += pedaco){
      const lote = novas.slice(i, i + pedaco).map(function(m){
        const copia = Object.assign({}, m);
        delete copia.repetida;
        return copia;
      });
      try{
        const r = await sb.from('marcas').insert(lote).select();
        if (r.error){ throw r.error; }
        const chegaram = (r.data || []);
        chegaram.forEach(function(linha){ dados.marcas.push(linha); });
        entraram += chegaram.length;
      }catch(e){
        falharam += lote.length;
      }
      const feito = Math.min(i + pedaco, novas.length);
      $('#andamento', fundo).textContent = feito + ' de ' + novas.length;
      $('#barraImport', fundo).style.width = Math.round((feito / novas.length) * 100) + '%';
    }

    let fim = '<p style="font-size:.95rem;font-weight:800;margin-bottom:6px">Pronto.</p>' +
      '<p style="font-size:.88rem">Entraram <b>' + entraram + '</b> ' +
      (entraram === 1 ? 'marca' : 'marcas') + ' na sua base.</p>';
    if (falharam){
      fim += '<p class="tr-dica" style="margin-top:10px">' + falharam + ' ' +
        (falharam === 1 ? 'linha não entrou' : 'linhas não entraram') +
        '. Pode ser algum campo fora do formato. Tente importar só essas de novo, ou me chame.</p>';
    }
    fim += '<div class="janela-pe"><button class="botao" type="button" data-fechar>fechar</button></div>';
    $('#passoImportar', fundo).innerHTML = fim;
    $$('[data-fechar]', fundo).forEach(function(b){ b.addEventListener('click', fecharJanela); });

    avisinho(entraram + ' marcas importadas.');
    desenharMarcas();
  }

  /* CSV com ponto e vírgula e com o marcador do começo (BOM),
     que é o que faz o Excel abrir com acento certo. */
  function baixarCSV(nome, lista){
    if (!lista || !lista.length){ avisinho('Não tem nada para baixar ainda.'); return; }
    const colunas = Object.keys(lista[0]).filter(function(c){ return c !== 'id'; });
    const linhas = [colunas.join(';')];
    lista.forEach(function(item){
      linhas.push(colunas.map(function(c){
        const valor = item[c] == null ? '' : String(item[c]);
        return '"' + valor.replace(/"/g,'""') + '"';
      }).join(';'));
    });
    const conteudo = '﻿' + linhas.join('\r\n');
    const url = URL.createObjectURL(new Blob([conteudo], { type:'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = nome + '-' + iso(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    avisinho('Arquivo baixado.');
  }

     ABA 3 · CALENDÁRIO
     ===================================================================== */
  const TIPOS_AGENDA = [{v:'gravar',t:'gravar'},{v:'editar',t:'editar'},{v:'postar',t:'postar'}];
  let mesVisto = (function(){ const d = hoje(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  let filtroTipo = 'todos';

  function itensDoDia(chave){
    const doBanco = dados.calendario.filter(function(c){
      if (String(c.data).slice(0,10) !== chave){ return false; }
      if (filtroTipo !== 'todos' && c.tipo !== filtroTipo){ return false; }
      return true;
    }).map(function(c){ return { tipo:c.tipo, titulo:c.titulo, marca:c.marca, status:c.status, id:c.id, prazo:false }; });

    /* prazos das campanhas entram sozinhos, sem você digitar de novo */
    const prazos = (filtroTipo !== 'todos') ? [] : dados.campanhas.filter(function(c){
      return c.prazo && String(c.prazo).slice(0,10) === chave;
    }).map(function(c){
      return { tipo:'prazo', titulo:'prazo: ' + (c.campanha || 'campanha'), marca:c.cliente, status:'', id:c.id, prazo:true };
    });

    return doBanco.concat(prazos);
  }

  function desenharCalendario(){
    $('#acaoDaAba').innerHTML = '<button class="botao" type="button" id="novoItem">+ novo item</button>';

    const h = hoje();
    const primeiro = new Date(mesVisto.getFullYear(), mesVisto.getMonth(), 1);
    /* a semana começa na segunda: domingo (0) vira o último dia */
    const deslocamento = (primeiro.getDay() + 6) % 7;
    const comeco = new Date(primeiro);
    comeco.setDate(primeiro.getDate() - deslocamento);

    const nomeMes = mesVisto.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });

    let html = '<div class="mes-topo">' +
      '<button class="chip" type="button" id="mesAnterior" aria-label="Mês anterior">&lt;</button>' +
      '<span class="mes-nome">' + escapar(nomeMes) + '</span>' +
      '<button class="chip" type="button" id="mesSeguinte" aria-label="Próximo mês">&gt;</button>' +
      '<button class="chip" type="button" id="mesAtual">Este mês</button>' +
      '<span style="flex:1"></span>' +
      '<button class="chip" type="button" data-tipo="todos" aria-pressed="' + (filtroTipo==='todos') + '">todos</button>' +
      TIPOS_AGENDA.map(function(t){
        return '<button class="chip" type="button" data-tipo="' + t.v + '" aria-pressed="' + (filtroTipo===t.v) + '">' + t.t + '</button>';
      }).join('') + '</div>';

    html += '<div class="grade-mes">' +
      ['seg','ter','qua','qui','sex','sáb','dom'].map(function(d){
        return '<div class="cabeca-dia">' + d + '</div>';
      }).join('');

    for (let i = 0; i < 42; i++){
      const d = new Date(comeco);
      d.setDate(comeco.getDate() + i);
      const chave = iso(d);
      const fora = d.getMonth() !== mesVisto.getMonth();
      const ehHoje = chave === iso(h);
      const itens = itensDoDia(chave);

      html += '<div class="dia ' + (fora ? 'fora ' : '') + (ehHoje ? 'hoje' : '') + '" data-dia="' + chave + '">' +
        '<span class="numero">' + d.getDate() + '</span>' +
        '<button class="mais-dia" type="button" data-add="' + chave + '" aria-label="Adicionar neste dia">+</button>';

      itens.slice(0,3).forEach(function(it){
        html += '<button class="evento ev-' + (it.prazo ? 'prazo' : escapar(it.tipo)) + (it.status === 'feito' ? ' feito' : '') + '" ' +
                'type="button" data-ver-dia="' + chave + '" title="' + escapar(it.titulo) + '">' +
                escapar(it.titulo) + '</button>';
      });
      if (itens.length > 3){
        html += '<button class="mais-itens" type="button" data-ver-dia="' + chave + '">+' + (itens.length - 3) + ' mais</button>';
      }
      html += '</div>';
    }
    html += '</div>';

    /* ficou pra trás */
    const atrasados = dados.calendario.filter(function(c){
      const d = deISO(c.data);
      return d && d < h && c.status !== 'feito';
    }).sort(function(a,b){ return deISO(a.data) - deISO(b.data); });

    html += '<div class="caixa" style="margin-top:18px"><p class="caixa-titulo">ficou pra trás</p>';
    if (!atrasados.length){
      html += '<p class="vazio">Nada atrasado. Tudo que passou já está marcado como feito.</p>';
    } else {
      html += atrasados.map(function(c){
        const dias = diasEntre(deISO(c.data), h);
        return '<div class="atrasado-linha">' +
          '<span class="dias-atras">há ' + dias + (dias === 1 ? ' dia' : ' dias') + '</span>' +
          '<span class="pilula p-lead">' + escapar(c.tipo) + '</span>' +
          '<strong>' + escapar(c.titulo || 'sem título') + '</strong>' +
          (c.marca ? '<span style="color:var(--tinta-suave)">' + escapar(c.marca) + '</span>' : '') +
          '<span style="flex:1"></span>' +
          '<button class="botao claro" type="button" data-feito="' + c.id + '">marcar como feito</button>' +
          '</div>';
      }).join('');
    }
    html += '</div>';

    $('#painel').innerHTML = html;

    $('#novoItem').addEventListener('click', function(){ formAgenda(null, iso(h)); });
    $('#mesAnterior').addEventListener('click', function(){ mesVisto = new Date(mesVisto.getFullYear(), mesVisto.getMonth()-1, 1); desenharCalendario(); });
    $('#mesSeguinte').addEventListener('click', function(){ mesVisto = new Date(mesVisto.getFullYear(), mesVisto.getMonth()+1, 1); desenharCalendario(); });
    $('#mesAtual').addEventListener('click', function(){ const a = hoje(); mesVisto = new Date(a.getFullYear(), a.getMonth(), 1); desenharCalendario(); });
    $$('[data-tipo]').forEach(function(b){
      b.addEventListener('click', function(){ filtroTipo = b.dataset.tipo; desenharCalendario(); });
    });
    $$('[data-add]').forEach(function(b){

    });
    $$('[data-ver-dia]').forEach(function(b){
      b.addEventListener('click', function(ev){ ev.stopPropagation(); verDia(b.dataset.verDia); });
    });
    $$('[data-dia]').forEach(function(cel){
      cel.addEventListener('click', function(){ formAgenda(null, cel.dataset.dia); });
    });
    $$('[data-feito]').forEach(function(b){
      b.addEventListener('click', async function(){
        const c = dados.calendario.filter(function(x){ return String(x.id) === b.dataset.feito; })[0];
        if (!c){ return; }
        const r = await gravar('calendario', { id:c.id, status:'feito' });
        if (r.ok){ c.status = 'feito'; avisinho('Marcado como feito.'); desenharCalendario(); }
      });
    });
  }

  function verDia(chave){
    const itens = itensDoDia(chave);
    const d = deISO(chave);
    const titulo = d ? d.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' }) : chave;
    const corpo = itens.length
      ? itens.map(function(it){
          return '<div class="atrasado-linha">' +
            '<span class="pilula p-lead">' + escapar(it.prazo ? 'prazo' : it.tipo) + '</span>' +
            '<strong>' + escapar(it.titulo) + '</strong>' +
            (it.marca ? '<span style="color:var(--tinta-suave)">' + escapar(it.marca) + '</span>' : '') +
            '<span style="flex:1"></span>' +
            (it.prazo ? '<span style="font-size:.75rem;color:var(--apagado)">vem das campanhas</span>'
                      : '<button class="botao claro" type="button" data-abrir-item="' + it.id + '">abrir</button>') +
            '</div>';
        }).join('')
      : '<p class="vazio">Nada marcado neste dia.</p>';

    const fundo = abrirJanela(titulo, corpo +
      '<div class="janela-pe"><button class="botao claro" type="button" data-fechar>Fechar</button>' +
      '<button class="botao" type="button" id="addNesseDia">+ adicionar neste dia</button></div>', true);

    $('#addNesseDia', fundo).addEventListener('click', function(){ formAgenda(null, chave); });
    $$('[data-abrir-item]', fundo).forEach(function(b){
      b.addEventListener('click', function(){
        const c = dados.calendario.filter(function(x){ return String(x.id) === b.dataset.abrirItem; })[0];
        formAgenda(c, chave);
      });
    });
  }

  function formAgenda(c, dia){
    const novo = !c;
    c = c || { titulo:'', marca:'', tipo:'gravar', data:dia, status:'a fazer' };
    const fundo = abrirJanela(novo ? 'Novo item na agenda' : 'Editar item',
      '<form id="formAgenda">' +
        campoTexto('aTitulo','o que é', c.titulo) +
        campoTexto('aMarca','marca', c.marca) +
        '<div class="dupla">' +
          campoLista('aTipo','tipo', c.tipo, TIPOS_AGENDA) +
          campoTexto('aData','dia', String(c.data || dia).slice(0,10), 'date') +
        '</div>' +
        campoLista('aStatus','situação', c.status, [{v:'a fazer',t:'a fazer'},{v:'feito',t:'feito'}]) +
        '<div class="janela-pe">' +
          (novo ? '' : '<button class="botao claro" type="button" id="apagarAgenda">Apagar</button>') +
          '<button class="botao claro" type="button" data-fechar>Cancelar</button>' +
          '<button class="botao" type="submit">' + (novo ? 'Adicionar' : 'Salvar') + '</button>' +
        '</div>' +
      '</form>');

    if (!novo){
      $('#apagarAgenda', fundo).addEventListener('click', function(){
        confirmar('Apagar este item da agenda?', async function(){
          if (await apagar('calendario', c.id)){
            dados.calendario = dados.calendario.filter(function(x){ return x.id !== c.id; });
            fecharJanela();
            avisinho('Item apagado.');
            desenharCalendario();
          }
        });
      });
    }

    $('#formAgenda', fundo).addEventListener('submit', async function(ev){
      ev.preventDefault();
      const registro = {
        titulo: $('#aTitulo').value.trim(),
        marca:  $('#aMarca').value.trim(),
        tipo:   $('#aTipo').value,
        data:   $('#aData').value || dia,
        status: $('#aStatus').value
      };
      if (!novo){ registro.id = c.id; }
      const r = await gravar('calendario', registro);
      if (!r.ok){ return; }
      if (novo && r.linha){ dados.calendario.push(r.linha); }
      else { Object.assign(c, registro); }
      fecharJanela();
      avisinho(novo ? 'Item adicionado na agenda.' : 'Item salvo.');
      desenharCalendario();
    });
  }

    const recebido = todas.filter(function(c){ return c.pagamento === 'pago'; })
                          .reduce(function(s,c){ return s + (Number(c.valor)||0); }, 0);
    const aReceber = totalValor - recebido;
