<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Lara Damasceno</title>
<meta name="description" content="Área restrita.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7f3e8'/%3E%3Crect x='5' y='8' width='22' height='2' fill='%23c8991f'/%3E%3Crect x='5' y='15' width='22' height='2' fill='%23c8991f'/%3E%3Crect x='5' y='22' width='13' height='2' fill='%23c74b34'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Mesmas cores e mesmos cantos do portfólio.
   Uma fonte só (Mulish), tamanhos pequenos, nada gritante.
   ========================================================= */
:root{
  --creme:#f7f3e8;
  --papel:#ffffff;
  --amarelo:#d4a017;
  --amarelo-escuro:#8a6a12;
  --tomate:#c74b34;
  --tinta:#2b2822;
  --tinta-suave:#5b5649;
  --apagado:#8d8779;
  --borda:rgba(43,40,34,.14);
  --borda-leve:rgba(43,40,34,.08);
  --raio:12px;
  --raio-p:9px;
  --lateral:216px;
  --azul:#3f6b7a;
  --verde:#5f6f45;
  --cinza:#8a857a;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;font-family:'Mulish',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.55;color:var(--tinta);background:var(--creme);
}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tomate);outline-offset:2px;border-radius:5px}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- carregando ---------- */
#carregando{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--creme);color:var(--tinta-suave);font-size:.9rem;z-index:300;
}

/* ---------- menu lateral ---------- */
.lateral{
  position:fixed;left:0;top:0;bottom:0;width:var(--lateral);z-index:60;
  background:var(--papel);border-right:1px solid var(--borda);
  display:flex;flex-direction:column;
}
.lateral-topo{padding:18px 18px 12px;border-bottom:1px solid var(--borda-leve)}
.logo{font-size:.95rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.logo span{
  display:block;font-size:.58rem;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--amarelo-escuro);margin-top:3px;
}
.lateral-menu{flex:1;overflow-y:auto;padding:14px 10px}
.grupo{
  font-size:.6rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--apagado);padding:12px 10px 6px;
}
.item{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-left:3px solid transparent;
  padding:9px 10px;border-radius:var(--raio-p);cursor:pointer;
  font-size:.88rem;font-weight:600;color:var(--tinta-suave);text-align:left;
  transition:background .15s ease,color .15s ease;
}
.item:hover{background:rgba(43,40,34,.045);color:var(--tinta)}
.item svg{flex:0 0 auto;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.item.ativo{background:rgba(212,160,23,.17);color:var(--amarelo-escuro);font-weight:800;border-left-color:var(--amarelo)}
.lateral-rodape{padding:14px;border-top:1px solid var(--borda-leve)}
.email-dona{font-size:.74rem;color:var(--apagado);word-break:break-all;margin-bottom:9px}
.sair{
  width:100%;background:none;border:1px solid var(--borda);border-radius:999px;
  padding:8px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--tinta-suave);
}
.sair:hover{border-color:var(--tomate);color:var(--tomate)}

/* ---------- topo do celular ---------- */
.topo-mobile{
  display:none;position:fixed;top:0;left:0;right:0;height:52px;z-index:70;
  background:var(--papel);border-bottom:1px solid var(--borda);
  align-items:center;gap:12px;padding:0 14px;
}
.hamburguer{
  width:38px;height:34px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  padding:0 8px;background:var(--creme);border:1px solid var(--borda);border-radius:8px;cursor:pointer;
}
.hamburguer i{display:block;height:2px;background:var(--tinta);border-radius:2px}
.fundo-gaveta{position:fixed;inset:0;background:rgba(43,40,34,.5);z-index:55}

/* ---------- conteúdo ---------- */
.conteudo{margin-left:var(--lateral);padding:20px 24px 70px;max-width:1240px}
.titulo-aba{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.sub-aba{font-size:.85rem;color:var(--tinta-suave);margin-top:2px}
.cabeca{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}

/* ---------- avisos ---------- */
.avisos{
  background:rgba(199,75,52,.09);border:1px solid rgba(199,75,52,.3);
  border-radius:var(--raio-p);padding:12px 14px;margin-bottom:16px;font-size:.85rem;
}
.avisos b{display:block;margin-bottom:5px;color:#8f2f1c}
.avisos li{margin-top:3px;color:var(--tinta-suave)}

/* ---------- caixas ---------- */
.caixa{
  background:var(--papel);border:1px solid var(--borda);border-radius:var(--raio);
  padding:16px;margin-bottom:16px;
}
.caixa-titulo{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado);margin-bottom:12px}

/* ---------- faixa de números ---------- */
.faixa-numeros{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  background:var(--papel);border:1px solid var(--borda);border-radius:var(--raio);
  margin-bottom:16px;overflow:hidden;
}
.faixa-numeros > div{padding:13px 15px;border-right:1px solid var(--borda-leve)}
.faixa-numeros > div:last-child{border-right:0}
.faixa-numeros .n{font-size:1.32rem;font-weight:800;line-height:1.1;color:var(--amarelo-escuro)}
.faixa-numeros .r{font-size:.66rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--apagado);margin-top:4px}
.faixa-numeros .sub{font-size:.75rem;color:var(--tinta-suave);margin-top:2px}

/* ---------- gráfico ---------- */
.grafico{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:6px}
.barra{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.barra .haste{
  width:100%;background:var(--amarelo);border-radius:5px 5px 0 0;min-height:3px;
  transition:background .15s ease;
}
.barra:hover .haste{background:var(--tomate)}
.barra .dia{font-size:.62rem;color:var(--apagado);white-space:nowrap}
.vazio{
  text-align:center;color:var(--tinta-suave);font-size:.86rem;
  padding:26px 14px;background:var(--creme);border-radius:var(--raio-p);border:1px dashed var(--borda);
}
.lead-site{
  display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--borda-leve);
}
.lead-site:last-child{border-bottom:0}
.lead-site .quando{
  flex:0 0 74px;font-size:.72rem;font-weight:800;color:var(--apagado);padding-top:2px;
}
.lead-site .recado{font-size:.84rem;color:var(--tinta-suave);margin-top:3px;line-height:1.5}
.lead-site .acoes-lead{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.selo-novo{
  background:rgba(199,75,52,.14);color:#8f2f1c;font-size:.62rem;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:7px;
}
.origem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--borda-leve)}
.origem:last-child{border-bottom:0}
.origem .nome{flex:0 0 130px;font-size:.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.origem .trilho{flex:1;height:7px;background:rgba(43,40,34,.07);border-radius:999px;overflow:hidden}
.origem .cheio{height:100%;background:var(--amarelo);border-radius:999px}
.origem .qtd{flex:0 0 auto;font-size:.8rem;font-weight:800;color:var(--tinta-suave)}

/* ---------- tabelas ---------- */
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{
  text-align:left;font-size:.64rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--apagado);padding:8px 10px;border-bottom:1px solid var(--borda);white-space:nowrap;
}
th.ordena{cursor:pointer;user-select:none}
th.ordena:hover{color:var(--tinta)}
th .seta{margin-left:4px;font-size:.7rem;opacity:.25}
th.ordena-ativa{color:var(--amarelo-escuro)}
th.ordena-ativa .seta{opacity:1}
td{padding:9px 10px;border-bottom:1px solid var(--borda-leve);vertical-align:middle}
tbody tr:hover{background:rgba(212,160,23,.06)}
tbody tr.clicavel{cursor:pointer}
tr.escondida td:not(.acoes){opacity:.45}
tr.favorita{box-shadow:inset 3px 0 0 var(--amarelo);background:rgba(212,160,23,.055)}
tr.ultima-fixada td{border-bottom:2px solid var(--amarelo)}
.acoes{white-space:nowrap;text-align:right}
.mini{
  background:none;border:1px solid var(--borda);border-radius:7px;
  width:28px;height:28px;cursor:pointer;color:var(--tinta-suave);
  display:inline-flex;align-items:center;justify-content:center;margin-left:4px;
}
.mini svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mini:hover{border-color:var(--amarelo);color:var(--amarelo-escuro);background:rgba(212,160,23,.1)}
.mini.perigo:hover{border-color:var(--tomate);color:var(--tomate);background:rgba(199,75,52,.09)}
.puxador{cursor:grab;color:var(--apagado);display:inline-flex;padding:4px}
.puxador:active{cursor:grabbing}
.puxador svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
tr.alvo-solta{background:rgba(212,160,23,.2)}
tr.arrastando{opacity:.4}
.estrela{background:none;border:0;cursor:pointer;padding:2px;color:var(--borda)}
.estrela svg{width:16px;height:16px;stroke:var(--apagado);fill:none;stroke-width:1.6;stroke-linejoin:round}
.estrela.marcada svg{fill:var(--amarelo);stroke:var(--amarelo)}

/* ---------- pílulas ---------- */
.pilula{
  display:inline-block;font-size:.67rem;font-weight:800;letter-spacing:.05em;
  padding:3px 9px;border-radius:999px;white-space:nowrap;
}
.p-lead{background:rgba(212,160,23,.2);color:var(--amarelo-escuro)}
.p-conversando{background:rgba(63,107,122,.17);color:#2f5462}
.p-cliente{background:rgba(95,111,69,.2);color:#46522f}
.p-parada{background:rgba(138,133,122,.2);color:#6a6559}
.p-conteudo{background:rgba(95,111,69,.18);color:#46522f}
.p-publicidade{background:rgba(199,75,52,.15);color:#8f2f1c}
.p-pago{background:rgba(95,111,69,.2);color:#46522f}
.p-pendente{background:rgba(212,160,23,.22);color:var(--amarelo-escuro)}
.p-f1{background:rgba(138,133,122,.18);color:#6a6559}
.p-f2{background:rgba(63,107,122,.14);color:#2f5462}
.p-f3{background:rgba(63,107,122,.2);color:#2f5462}
.p-f4{background:rgba(212,160,23,.2);color:var(--amarelo-escuro)}
.p-f5{background:rgba(212,160,23,.3);color:var(--amarelo-escuro)}
.p-f6{background:rgba(95,111,69,.18);color:#46522f}
.p-f7{background:rgba(95,111,69,.3);color:#3b4626}
.etiqueta{font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;white-space:nowrap}
.e-atraso{background:rgba(199,75,52,.15);color:#8f2f1c}
.e-perto{background:rgba(212,160,23,.25);color:var(--amarelo-escuro)}

/* ---------- controles ---------- */
.barra-ferramentas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.busca{
  flex:1 1 200px;min-width:170px;font:inherit;font-size:.86rem;
  background:var(--papel);border:1px solid var(--borda);border-radius:999px;padding:8px 14px;color:var(--tinta);
}
.busca:focus{outline:none;border-color:var(--amarelo);box-shadow:0 0 0 3px rgba(212,160,23,.2)}
.chip{
  background:var(--papel);border:1px solid var(--borda);border-radius:999px;
  padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--tinta-suave);
}
.chip:hover{border-color:var(--amarelo);color:var(--amarelo-escuro)}
.chip[aria-pressed="true"]{background:rgba(212,160,23,.18);border-color:var(--amarelo);color:var(--amarelo-escuro)}
.botao{
  background:var(--tomate);color:#fff;border:0;border-radius:999px;
  padding:8px 16px;font-size:.83rem;font-weight:800;cursor:pointer;white-space:nowrap;
}
.botao:hover{background:#b24029}
.botao.claro{background:var(--papel);color:var(--tinta-suave);border:1px solid var(--borda)}
.botao.claro:hover{background:var(--creme);color:var(--amarelo-escuro);border-color:var(--amarelo)}

/* ---------- calendário ---------- */
.mes-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mes-nome{font-size:.95rem;font-weight:800;min-width:150px;text-transform:capitalize}
.grade-mes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cabeca-dia{
  font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--apagado);text-align:center;padding-bottom:4px;
}
.dia{
  position:relative;min-height:92px;background:var(--papel);border:1px solid var(--borda-leve);
  border-radius:var(--raio-p);padding:5px 6px;cursor:pointer;
}
.dia:hover{border-color:var(--amarelo)}
.dia.fora{background:rgba(255,255,255,.45);opacity:.5}
.dia.hoje{border-color:var(--tomate);box-shadow:inset 0 0 0 1px var(--tomate)}
.dia .numero{font-size:.72rem;font-weight:800;color:var(--tinta-suave)}
.dia.hoje .numero{color:var(--tomate)}
.dia .mais-dia{
  position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:6px;
  background:rgba(212,160,23,.2);color:var(--amarelo-escuro);border:0;cursor:pointer;
  font-size:.85rem;line-height:1;display:none;align-items:center;justify-content:center;font-weight:800;
}
.dia:hover .mais-dia{display:flex}
.evento{
  display:block;width:100%;text-align:left;border:0;cursor:pointer;
  font-size:.68rem;font-weight:700;line-height:1.25;padding:2px 5px;border-radius:5px;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ev-gravar{background:rgba(199,75,52,.14);color:#8f2f1c}
.ev-editar{background:rgba(63,107,122,.16);color:#2f5462}
.ev-postar{background:rgba(95,111,69,.18);color:#46522f}
.ev-prazo{background:rgba(212,160,23,.24);color:var(--amarelo-escuro)}
.evento.feito{opacity:.5;text-decoration:line-through}
.mais-itens{font-size:.63rem;font-weight:800;color:var(--apagado);margin-top:3px;background:none;border:0;cursor:pointer;padding:1px 4px}
.mais-itens:hover{color:var(--amarelo-escuro)}
.atrasado-linha{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid var(--borda-leve);font-size:.85rem;
}
.atrasado-linha:last-child{border-bottom:0}
.dias-atras{font-size:.7rem;font-weight:800;color:var(--tomate);background:rgba(199,75,52,.12);padding:2px 8px;border-radius:999px}

/* ---------- checklist ---------- */
.sub-abas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--borda);padding-bottom:10px}
.secao-cl{background:var(--papel);border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:10px;overflow:hidden}
.secao-cabeca{
  width:100%;display:flex;align-items:center;gap:11px;padding:13px 15px;
  background:none;border:0;cursor:pointer;text-align:left;
}
.secao-cabeca:hover{background:rgba(212,160,23,.06)}
.secao-emoji{font-size:1.1rem;flex:0 0 auto}
.secao-nome{font-size:.92rem;font-weight:800}
.secao-resumo{font-size:.78rem;color:var(--tinta-suave)}
.secao-conta{margin-left:auto;font-size:.72rem;font-weight:800;color:var(--apagado);white-space:nowrap}
.trilho{height:5px;background:rgba(43,40,34,.08);border-radius:999px;overflow:hidden}
.cheio{height:100%;background:var(--amarelo);border-radius:999px;transition:width .3s ease}
.secao-corpo{padding:0 15px 14px;border-top:1px solid var(--borda-leve)}
.porque{
  font-size:.83rem;color:var(--tinta-suave);background:var(--creme);
  border-left:3px solid var(--amarelo);border-radius:0 8px 8px 0;padding:10px 12px;margin:12px 0;
}
.item-cl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--borda-leve)}
.item-cl:last-child{border-bottom:0}
.item-cl input{margin-top:3px;width:16px;height:16px;accent-color:var(--amarelo);flex:0 0 auto;cursor:pointer}
.item-cl .t{font-size:.87rem;font-weight:700;cursor:pointer}
.item-cl .d{font-size:.79rem;color:var(--tinta-suave);margin-top:2px}
.item-cl.pronto .t{color:var(--apagado);text-decoration:line-through}
.grade-ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.cartao-ref{
  display:block;width:100%;
  background:var(--papel);border:1px solid var(--borda);border-radius:var(--raio);
  overflow:hidden;cursor:pointer;text-align:left;padding:0;
}
.cartao-ref:hover{border-color:var(--amarelo);transform:translateY(-2px)}
.capa-ref{display:block;position:relative;aspect-ratio:9/16;background:linear-gradient(145deg,#f0e9d4,#dcbe6a 60%,#8a6a12)}
.capa-ref img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capa-ref .emoji{position:absolute;top:8px;left:8px;font-size:1.2rem;background:rgba(255,255,255,.9);border-radius:8px;padding:2px 6px}
.capa-ref .dur{position:absolute;bottom:8px;right:8px;font-size:.65rem;font-weight:800;background:rgba(43,40,34,.78);color:#fff;padding:2px 7px;border-radius:999px}
.corpo-ref{padding:10px 12px 13px}
.corpo-ref h4{font-size:.86rem;font-weight:800;line-height:1.25}
.corpo-ref p{font-size:.74rem;color:var(--tinta-suave);margin-top:3px}
.bloco-tempo{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--borda-leve)}
.bloco-tempo:last-child{border-bottom:0}
.bloco-tempo .t{
  flex:0 0 66px;font-size:.68rem;font-weight:800;color:var(--amarelo-escuro);
  background:rgba(212,160,23,.15);border-radius:6px;padding:3px 6px;height:fit-content;text-align:center;
}
.bloco-tempo .o{font-size:.83rem;line-height:1.5}
.bloco-tempo .o b{font-weight:800}
.bloco-tempo .o em{font-style:italic;color:var(--tinta-suave)}
.ideia{padding:9px 0;border-bottom:1px solid var(--borda-leve)}
.ideia:last-child{border-bottom:0}
.ideia .t{font-size:.86rem;font-weight:700}
.ideia .g{font-size:.8rem;color:var(--tinta-suave);font-style:italic;margin-top:3px}
.ideia .g::before{content:'gancho: ';font-style:normal;font-weight:800;color:var(--amarelo-escuro)}
textarea.roteiro{
  width:100%;min-height:150px;font:inherit;font-size:.87rem;line-height:1.6;
  background:var(--creme);border:1px solid var(--borda);border-radius:var(--raio-p);padding:12px;resize:vertical;color:var(--tinta);
}
textarea.roteiro:focus{outline:none;background:#fff;border-color:var(--amarelo);box-shadow:0 0 0 3px rgba(212,160,23,.2)}

/* ---------- transcrições ---------- */
.grade-transcricoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cartao-tr{
  display:block;width:100%;text-align:left;cursor:pointer;padding:0;overflow:hidden;

}

.tr-corpo{padding:11px 13px 14px}

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-youtube{background:rgba(199,75,52,.15);color:#8f2f1c}
.p-instagram{background:rgba(63,107,122,.17);color:#2f5462}
.p-tiktok{background:rgba(43,40,34,.12);color:#3d3930}
.p-outro{background:rgba(138,133,122,.2);color:#6a6559}
.p-nicho{background:rgba(63,107,122,.14);color:#2f5462}

.tr-detalhe{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.tr-abas{display:flex;gap:6px;margin-bottom:10px}

}
.salvo-em{font-size:.76rem;color:var(--apagado);align-self:center}
.tr-video{position:relative;background:#000;border-radius:var(--raio);overflow:hidden}
.tr-video.vertical{aspect-ratio:9/16}
.tr-video.alto{height:620px}
.tr-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tr-sem-preview{

}
textarea.transcricao{
  width:100%;min-height:260px;font:inherit;font-size:.86rem;line-height:1.65;

.passo{

<script>
(function(){
  'use strict';

  /* =====================================================================
     ATALHOS E AJUDANTES
     ===================================================================== */
  const $  = function(s,e){ return (e||document).querySelector(s); };
  const $$ = function(s,e){ return Array.prototype.slice.call((e||document).querySelectorAll(s)); };

  function escapar(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function iso(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  /* datas do banco chegam como 2026-09-19; montamos no fuso daqui,
     senão o dia volta um por causa do horário universal */
  function deISO(s){
    if (!s) return null;
    const p = String(s).slice(0,10).split('-');
    if (p.length !== 3) return null;
    const d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    return isNaN(d.getTime()) ? null : d;
  }
  function hoje(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
  function diasEntre(a,b){ return Math.round((b - a) / 86400000); }
  function dataCurta(s){
    const d = deISO(s);
    if (!d) return '';
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  }
  function dinheiro(v){
    const n = Number(v) || 0;
    return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }
  function numero(v){ return (Number(v) || 0).toLocaleString('pt-BR'); }
  function semAcento(t){
    return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  }

  function avisinho(texto){
    const velho = $('.avisinho');
    if (velho){ velho.remove(); }
    const el = document.createElement('div');
    el.className = 'avisinho';
    el.setAttribute('role','status');
    el.textContent = texto;
    document.body.appendChild(el);
    setTimeout(function(){ if (el.parentNode){ el.remove(); } }, 2600);
  }

  /* =====================================================================
     CONEXÃO E PORTEIRO
     A primeira coisa que acontece: conferir a sessão.
     Sem sessão, vai para o login e a página nem aparece.
     ===================================================================== */
  const sb = window.conectarBanco();
  if (!sb){
    $('#carregando').textContent = 'A biblioteca de acesso não carregou. Recarregue a página, por favor.';
    return;
  }

  let usuario = null;

  sb.auth.getSession().then(function(r){
    const sessao = r && r.data ? r.data.session : null;
    if (!sessao){ location.replace('../login/'); return; }
    usuario = sessao.user;
    começar();
  }).catch(function(){
    location.replace('../login/');
  });

  /* =====================================================================
     DADOS
     Tudo que falhar vira aviso na tela, nunca tela em branco.
     ===================================================================== */
  const dados = { videos:[], marcas:[], calendario:[], campanhas:[], visitas:[], marcados:{}, transcricoes:[], envios:[], optout:[] };
  const avisos = [];

  function explicarErro(tabela, e){
    const m = semAcento((e && e.message) || '');
    const codigo = (e && e.code) || '';
    if (m.indexOf('does not exist') >= 0 || m.indexOf('schema cache') >= 0 ||
        codigo === '42P01' || codigo === 'PGRST205' || codigo === 'PGRST202'){
      return { tipo:'falta-tabela', tabela: tabela, texto: 'A tabela "' + tabela + '" ainda não existe no banco.' };
    }
    if (m.indexOf('column') >= 0 || codigo === '42703' || codigo === 'PGRST204'){
      return { tipo:'outro', texto:'Faltou um campo na tabela "' + tabela + '". Rode o banco.sql de novo no Supabase.' };
    }
    if (m.indexOf('permission') >= 0 || m.indexOf('row-level') >= 0 || m.indexOf('policy') >= 0 || codigo === '42501'){
      return { tipo:'outro', texto:'O banco não deixou usar a tabela "' + tabela + '". Confira se você entrou com o e-mail ' + window.BANCO.dona + '.' };
    }
    if (m.indexOf('fetch') >= 0 || m.indexOf('network') >= 0){
      return { tipo:'outro', texto:'Não consegui falar com o banco agora. Confira a sua internet.' };
    }
    return { tipo:'outro', texto:'Não consegui carregar a tabela "' + tabela + '" agora.' };
  }

  function registrarAviso(aviso){
    const jaTem = avisos.some(function(a){ return a.texto === aviso.texto; });
    if (!jaTem){ avisos.push(aviso); }
  }

  /* O aviso de tabela faltando vira um recado só, com o passo a passo,
     em vez de seis linhas repetindo a mesma coisa. */
  function mostrarAvisos(){
    const caixa = $('#avisos');
    if (!avisos.length){ caixa.hidden = true; return; }

  async function ler(tabela, coluna, crescente){
    try{
      let consulta = sb.from(tabela).select('*');
      if (coluna){ consulta = consulta.order(coluna, { ascending: crescente !== false }); }
      const r = await consulta;
      if (r.error){ throw r.error; }
      return Array.isArray(r.data) ? r.data : [];
    }catch(e){
      registrarAviso(explicarErro(tabela, e));
      return [];
    }
  }

  async function gravar(tabela, registro){
    try{
      let r;
      if (registro.id){
        const copia = Object.assign({}, registro);
        delete copia.id;
        r = await sb.from(tabela).update(copia).eq('id', registro.id).select();
      } else {
        r = await sb.from(tabela).insert(registro).select();
      }
      if (r.error){ throw r.error; }
      return { ok:true, linha: (r.data && r.data[0]) || null };
    }catch(e){
      avisinho('Não deu para salvar. ' + explicarErro(tabela, e).texto);
      return { ok:false };
    }
  }

  async function apagar(tabela, id){
    try{
      const r = await sb.from(tabela).delete().eq('id', id);
      if (r.error){ throw r.error; }
      return true;
    }catch(e){
      avisinho('Não deu para apagar. ' + explicarErro(tabela, e).texto);
      return false;
    }
  }

  let fecharJanelaAtual = null;

  function abrirJanela(titulo, corpoHtml, larga){
    fecharJanela();
    const fundo = document.createElement('div');
    fundo.className = 'fundo-janela';
    fundo.innerHTML =
      '<div class="janela' + (larga ? ' larga' : '') + '" role="dialog" aria-modal="true" aria-label="' + escapar(titulo) + '">' +
        '<div class="janela-topo">' +
          '<h2 class="janela-titulo">' + escapar(titulo) + '</h2>' +
          '<button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>' +
        '</div>' + corpoHtml +
      '</div>';
    $('#janelas').appendChild(fundo);

    const foco = document.activeElement;
    function teclas(ev){
      if (ev.key === 'Escape'){ fecharJanela(); return; }
      if (ev.key !== 'Tab'){ return; }
      const focaveis = $$('button, [href], input, select, textarea', fundo).filter(function(el){ return !el.disabled; });
      if (!focaveis.length){ return; }
      const pri = focaveis[0], ult = focaveis[focaveis.length-1];
      if (ev.shiftKey && document.activeElement === pri){ ev.preventDefault(); ult.focus(); }
      else if (!ev.shiftKey && document.activeElement === ult){ ev.preventDefault(); pri.focus(); }
    }
    document.addEventListener('keydown', teclas);
    fundo.addEventListener('mousedown', function(ev){ if (ev.target === fundo){ fecharJanela(); } });
    $$('[data-fechar]', fundo).forEach(function(b){ b.addEventListener('click', fecharJanela); });

    fecharJanelaAtual = function(){
      document.removeEventListener('keydown', teclas);
      if (fundo.parentNode){ fundo.remove(); }
      fecharJanelaAtual = null;
      if (foco && foco.focus){ foco.focus(); }
    };

    const primeiro = $('input, select, textarea, button', fundo);
    if (primeiro){ primeiro.focus(); }
    return fundo;
  }
  function fecharJanela(){ if (fecharJanelaAtual){ fecharJanelaAtual(); } }

  function desenharPortfolio(){
    $('#acaoDaAba').innerHTML = '<button class="botao" type="button" id="novoVideo">+ novo vídeo</button>';
    $('#novoVideo').addEventListener('click', function(){ formVideo(null); });

    const h = hoje();
    const inicio = new Date(h); inicio.setDate(h.getDate() - 13);

    /* A tabela visitas guarda duas coisas: a visita da página, que
       começa com barra, e os cliques, que começam com uma palavra.
       Aqui eu separo as duas antes de contar qualquer número. */
    const paginas = dados.visitas.filter(function(v){
      return String(v.pagina || '').charAt(0) === '/';
    });
    const eventos = dados.visitas.filter(function(v){
      return String(v.pagina || '').charAt(0) !== '/';
    });

    const porDia = {};
    for (let i = 0; i < 14; i++){
      const d = new Date(inicio); d.setDate(inicio.getDate() + i);
      porDia[iso(d)] = 0;
    }
    let em14 = 0, hojeConta = 0;
    const origens = {};
    paginas.forEach(function(v){
      const chave = String(v.data || '').slice(0,10);
      if (porDia[chave] !== undefined){ porDia[chave]++; em14++; }
      if (chave === iso(h)){ hojeConta++; }
      const o = (v.origem || 'direto').trim() || 'direto';
      origens[o] = (origens[o] || 0) + 1;
    });

    const noAr = dados.videos.filter(function(v){ return v.visivel !== false; }).length;

    const porNicho = {};
    dados.videos.forEach(function(v){
      const n = (v.nicho || 'sem nicho').trim() || 'sem nicho';
      porNicho[n] = (porNicho[n] || 0) + 1;
    });
    const nichoTop = Object.keys(porNicho).sort(function(a,b){ return porNicho[b] - porNicho[a]; })[0];
    const origensOrdem = Object.keys(origens).sort(function(a,b){ return origens[b] - origens[a]; });
    const origemTop = origensOrdem[0];

    let html = '<div class="faixa-numeros">' +
      bloco(numero(em14), 'visitas em 14 dias') +
      bloco(numero(hojeConta), 'visitas hoje') +
      bloco(numero(noAr), 'vídeos no ar', dados.videos.length + ' no total') +
      bloco(nichoTop ? nichoTop : 'sem vídeo', 'nicho mais forte', nichoTop ? porNicho[nichoTop] + ' vídeos' : '') +
      bloco(origemTop ? origemTop : 'sem visita', 'de onde mais vêm', origemTop ? numero(origens[origemTop]) + ' visitas' : '') +
      '</div>';

    html += blocoLeadsDoSite();

    /* gráfico dos 14 dias, ou a frase explicando o que vai aparecer */
    html += '<div class="caixa"><p class="caixa-titulo">visitas dos últimos 14 dias</p>';
    if (em14 === 0){
      html += '<p class="vazio">Aqui vai aparecer uma barra por dia, com quantas pessoas abriram o seu portfólio. ' +
              'Como ninguém visitou ainda, não tem barra nenhuma para mostrar. ' +
              'Assim que você mandar o link do site para alguém, os números começam a aparecer sozinhos.</p>';
    } else {
      const maior = Math.max.apply(null, Object.keys(porDia).map(function(k){ return porDia[k]; }));
      html += '<div class="grafico">' + Object.keys(porDia).map(function(k){
        const q = porDia[k];
        const altura = maior > 0 ? Math.max(3, Math.round((q / maior) * 100)) : 3;
        return '<div class="barra" title="' + dataCurta(k) + ': ' + q + ' visitas">' +
                 '<div class="haste" style="height:' + altura + '%"></div>' +
                 '<span class="dia">' + dataCurta(k).slice(0,2) + '</span></div>';
      }).join('') + '</div>';
    }
    html += '</div>';

    html += '<div class="caixa"><p class="caixa-titulo">por onde as pessoas chegaram</p>';
    if (!origensOrdem.length){
      html += '<p class="vazio">Quando alguém abrir o seu portfólio, aqui vai aparecer de onde a pessoa veio: ' +
              'do Instagram, do Google, de um link que você mandou no WhatsApp ou direto pelo endereço.</p>';
    } else {
      const totalOrigens = origensOrdem.reduce(function(s,o){ return s + origens[o]; }, 0);
      html += origensOrdem.slice(0,8).map(function(o){
        const parte = totalOrigens > 0 ? Math.round((origens[o] / totalOrigens) * 100) : 0;
        return '<div class="origem"><span class="nome">' + escapar(o) + '</span>' +
               '<span class="trilho"><span class="cheio" style="width:' + parte + '%"></span></span>' +
               '<span class="qtd">' + numero(origens[o]) + '</span></div>';
      }).join('');
    }
    html += '</div>';

    /* vídeos mais clicados */
    const cliques = {};
    eventos.forEach(function(v){
      const nome = String(v.pagina || '');
      if (nome.indexOf('video: ') !== 0){ return; }
      const marca = nome.slice(7).trim() || 'sem nome';
      cliques[marca] = (cliques[marca] || 0) + 1;
    });
    const maisClicados = Object.keys(cliques).sort(function(a,b){ return cliques[b] - cliques[a]; });

    html += '<div class="caixa"><p class="caixa-titulo">vídeos mais clicados</p>';
    if (!maisClicados.length){
      html += '<p class="vazio">Toda vez que alguém abrir um vídeo no seu portfólio, ele entra nesta lista. ' +
              'Serve para você saber qual conteúdo puxa mais atenção e colocar os melhores no topo da galeria.</p>';
    } else {
      const maiorClique = cliques[maisClicados[0]];
      html += maisClicados.slice(0,8).map(function(m, i){
        const parte = maiorClique > 0 ? Math.round((cliques[m] / maiorClique) * 100) : 0;
        return '<div class="origem"><span class="nome">' + (i+1) + '. ' + escapar(m) + '</span>' +
               '<span class="trilho"><span class="cheio" style="width:' + parte + '%"></span></span>' +
               '<span class="qtd">' + numero(cliques[m]) + '</span></div>';
      }).join('');
    }
    html += '</div>';

    /* do primeiro clique até a mensagem */
    const totalVisitas = paginas.length;
    const chegouNoForm = eventos.filter(function(v){ return v.pagina === 'secao: contato'; }).length;
    const mandouMensagem = eventos.filter(function(v){ return v.pagina === 'formulario enviado'; }).length;
    /* sem visita nenhuma, a conta de porcentagem nem acontece */
    function parteDe(n){ return totalVisitas > 0 ? Math.round((n / totalVisitas) * 100) + '%' : 'sem base ainda'; }

    html += '<div class="caixa"><p class="caixa-titulo">do primeiro clique até a mensagem</p>';
    if (totalVisitas === 0){
      html += '<p class="vazio">Este bloco vai mostrar o caminho que as pessoas fazem no seu site: ' +
              'quantas abriram o portfólio, quantas rolaram até o formulário e quantas realmente te mandaram mensagem. ' +
              'Como ainda não houve visita, não tem caminho para desenhar.</p>';
    } else {
      html += '<div class="faixa-numeros" style="margin:0;border:0">' +
        bloco(numero(totalVisitas), 'abriram o portfólio', 'todas as visitas registradas') +
        bloco(numero(chegouNoForm), 'rolaram até o formulário', parteDe(chegouNoForm) + ' de quem visitou') +
        bloco(numero(mandouMensagem), 'mandaram mensagem', parteDe(mandouMensagem) + ' de quem visitou') +
        '</div>';
    }
    html += '</div>';

    html += '<div class="caixa"><p class="caixa-titulo">os meus vídeos</p>' + tabelaVideos() + '</div>';

    $('#painel').innerHTML = html;
    ligarTabelaVideos();
    ligarLeadsDoSite();
    ligarRelogioDosLeads();
  }

  /* ---------- quem preencheu o formulário do portfólio ---------- */
  function leadsDoSite(){
    return dados.marcas.filter(function(m){ return m.origem === 'site'; })
      .slice().sort(function(a,b){
        return String(b.criado_em || '').localeCompare(String(a.criado_em || ''));
      });
  }

  function quandoChegou(criadoEm){
    const d = criadoEm ? new Date(criadoEm) : null;
    if (!d || isNaN(d.getTime())){ return { texto:'·', novo:false }; }
    const minutos = Math.round((Date.now() - d.getTime()) / 60000);
    const novo = minutos < 1440;
    let texto;
    if (minutos < 1){ texto = 'agora'; }
    else if (minutos < 60){ texto = 'há ' + minutos + ' min'; }
    else if (minutos < 1440){ texto = 'há ' + Math.round(minutos/60) + 'h'; }
    else {
      texto = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    }
    return { texto: texto, novo: novo };
  }

  function ligarLeadsDoSite(){

    if (botao){

    $$('[data-abrir-lead]').forEach(function(b){

        if (m){ formMarca(m); }

  /* procura contato novo de tempos em tempos, e só redesenha se
     chegou alguém, para não atrapalhar enquanto ela está mexendo */
  let relogioLeads = null;
  function ligarRelogioDosLeads(){
    pararRelogioDosLeads();
    relogioLeads = setInterval(async function(){
      if (abaAtual !== 'portfolio'){ pararRelogioDosLeads(); return; }
      const antes = leadsDoSite().length;
      const novos = await ler('marcas', 'nome', true);
      if (!novos.length){ return; }
      const depois = novos.filter(function(m){ return m.origem === 'site'; }).length;
      if (depois !== antes){
        dados.marcas = novos;
        avisinho(depois > antes ? 'Chegou contato novo pelo site.' : 'Lista de contatos atualizada.');
        desenharPortfolio();
      }
    }, 45000);

  function pararRelogioDosLeads(){
    if (relogioLeads){ clearInterval(relogioLeads); relogioLeads = null; }

           (sub ? '<div class="sub">' + escapar(sub) + '</div>' : '') + '</div>';

                : '<svg viewBox="0 0 24 24"><path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7z"/><circle cx="12" cy="12" r="2.5"/></svg>') +

  function ligarTabelaVideos(){
    $$('[data-olho]').forEach(function(b){
      b.addEventListener('click', async function(){
        const v = dados.videos.filter(function(x){ return String(x.id) === b.dataset.olho; })[0];
        if (!v){ return; }
        const novo = !(v.visivel !== false);
        const r = await gravar('videos', { id: v.id, visivel: novo });
        if (r.ok){
          v.visivel = novo;
          avisinho(novo ? 'Vídeo voltou para o site.' : 'Vídeo escondido do site.');
          desenharPortfolio();
        }
      });
    });
    $$('[data-editar]').forEach(function(b){
      b.addEventListener('click', function(){
        const v = dados.videos.filter(function(x){ return String(x.id) === b.dataset.editar; })[0];
        formVideo(v);
      });
    });
    $$('[data-apagar]').forEach(function(b){
      b.addEventListener('click', function(){
        const v = dados.videos.filter(function(x){ return String(x.id) === b.dataset.apagar; })[0];
        if (!v){ return; }
        confirmar('Apagar o vídeo de ' + (v.marca || 'sem marca') + '? Ele some do site também.', async function(){
          if (await apagar('videos', v.id)){
            dados.videos = dados.videos.filter(function(x){ return x.id !== v.id; });
            avisinho('Vídeo apagado.');
            desenharPortfolio();
          }
        });
      });
    });

    /* arrastar pela alcinha para mudar a ordem */
    let arrastando = null;
    $$('#corpoVideos tr').forEach(function(tr){
      const puxador = $('.puxador', tr);
      if (puxador){
        puxador.addEventListener('dragstart', function(ev){
          arrastando = tr;
          tr.classList.add('arrastando');
          ev.dataTransfer.effectAllowed = 'move';
          ev.dataTransfer.setData('text/plain', tr.dataset.id);
        });
        puxador.addEventListener('dragend', function(){
          if (arrastando){ arrastando.classList.remove('arrastando'); }
          $$('#corpoVideos tr').forEach(function(x){ x.classList.remove('alvo-solta'); });
        });
      }
      tr.addEventListener('dragover', function(ev){
        if (!arrastando || arrastando === tr){ return; }
        ev.preventDefault();
        tr.classList.add('alvo-solta');
      });
      tr.addEventListener('dragleave', function(){ tr.classList.remove('alvo-solta'); });
      tr.addEventListener('drop', async function(ev){
        ev.preventDefault();
        tr.classList.remove('alvo-solta');
        if (!arrastando || arrastando === tr){ return; }
        const de = dados.videos.findIndex(function(v){ return String(v.id) === arrastando.dataset.id; });
        const para = dados.videos.findIndex(function(v){ return String(v.id) === tr.dataset.id; });
        if (de < 0 || para < 0){ return; }
        const item = dados.videos.splice(de,1)[0];
        dados.videos.splice(para, 0, item);

        const mudaram = [];
        dados.videos.forEach(function(v,i){
          if (v.ordem !== i+1){ v.ordem = i+1; mudaram.push(v); }
        });
        desenharPortfolio();
        try{
          await Promise.all(mudaram.map(function(v){
            return sb.from('videos').update({ ordem: v.ordem }).eq('id', v.id);
          }));
          avisinho('Nova ordem salva.');
        }catch(e){
          avisinho('A ordem mudou na tela, mas não consegui salvar no banco.');
        }
      });
    });
  }

  function formVideo(v){
    const novo = !v;
    v = v || { titulo:'', link:'', nicho:'', formato:'vídeo 9:16', marca:'', destaque:'', visivel:true };

    /* O nicho vira uma lista com os que já existem, em vez de campo
       livre. Digitar "casa e decoração" onde os outros vídeos usam
       "casa" criaria um filtro novo e separado lá no site. */
    const nichosEmUso = [];
    dados.videos.forEach(function(x){
      const n = (x.nicho || '').trim();
      if (n && nichosEmUso.indexOf(n) < 0){ nichosEmUso.push(n); }
    });
    nichosEmUso.sort();
    if (v.nicho && nichosEmUso.indexOf(v.nicho) < 0){ nichosEmUso.push(v.nicho); }
    const opcoesNicho = nichosEmUso.map(function(n){ return { v:n, t:n }; })
      .concat([{ v:'__novo__', t:'criar um nicho novo...' }]);

    const fundo = abrirJanela(novo ? 'Novo vídeo' : 'Editar vídeo',
      '<form id="formVideo">' +
        campoTexto('vMarca','marca', v.marca) +
        campoTexto('vTitulo','título (a linha curta embaixo do nome)', v.titulo) +
        campoTexto('vLink','link do vídeo', v.link, 'url') +
        '<div class="dupla">' +
          campoLista('vNicho','nicho', v.nicho || (nichosEmUso[0] || '__novo__'), opcoesNicho) +
          campoTexto('vFormato','formato', v.formato) +
        '</div>' +
        '<div class="campo" id="caixaNichoNovo" hidden>' +
          '<label for="vNichoNovo">nome do nicho novo</label>' +
          '<input type="text" id="vNichoNovo" placeholder="ex: pets">' +
          '<span style="display:block;font-size:.74rem;color:var(--apagado);margin-top:4px">' +
          'Isso cria um botão de filtro novo no site. Escreva tudo em minúsculo e sem acento.</span>' +
        '</div>' +
        campoTexto('vDestaque','destaque (ex: 2,4M views). Deixe vazio se não tiver.', v.destaque) +
        campoLista('vVisivel','aparece no site?', v.visivel === false ? 'nao' : 'sim', [{v:'sim',t:'sim, aparece'},{v:'nao',t:'não, fica escondido'}]) +
        pe(novo ? 'Adicionar' : 'Salvar') +
      '</form>');

    /* mostra o campo de escrever só quando ela escolhe criar um nicho novo */
    const listaNicho = $('#vNicho', fundo);
    function conferirNicho(){
      $('#caixaNichoNovo', fundo).hidden = listaNicho.value !== '__novo__';
    }
    listaNicho.addEventListener('change', conferirNicho);
    conferirNicho();

    $('#formVideo', fundo).addEventListener('submit', async function(ev){
      ev.preventDefault();
      const nichoEscolhido = listaNicho.value === '__novo__'
        ? $('#vNichoNovo').value.trim()
        : listaNicho.value;
      const registro = {
        marca:   $('#vMarca').value.trim(),
        titulo:  $('#vTitulo').value.trim(),
        link:    $('#vLink').value.trim(),
        nicho:   nichoEscolhido,
        formato: $('#vFormato').value.trim(),
        destaque:$('#vDestaque').value.trim(),
        visivel: $('#vVisivel').value === 'sim'
      };
      if (novo){
        registro.ordem = dados.videos.length + 1;
      } else {
        registro.id = v.id;
      }
      const r = await gravar('videos', registro);
      if (!r.ok){ return; }
      if (novo && r.linha){ dados.videos.push(r.linha); }
      else { Object.assign(v, registro); }
      fecharJanela();
      avisinho(novo ? 'Vídeo adicionado. Já está no site.' : 'Vídeo salvo.');
      desenharPortfolio();
    });
  }

  /* =====================================================================
     ABA · PROSPECÇÃO
     Os e-mails saem da tabela marcas, que já existe. Nada de
     cadastro novo, nada de colar e-mail na mão.
     ===================================================================== */
  const EMAIL_CONTATO = window.BANCO.dona;
  const NOME_REMETENTE = 'Lara Damasceno';
  const RODAPE_SAIR = 'Se não quiser mais receber, responda este e-mail com SAIR.';

  let pros = {
    motor: 'resend',
    destino: 'selecionadas',
    modoTexto: true,
    assunto: '',
    texto: '',
    htmlBruto: '',
    botaoTexto: '',
    botaoLink: '',
    pularJaRecebeu: true,
    buscaHistorico: '',
    fila: null,
    filaIndice: 0,
    remetenteReal: ''
  };

  /* o endereço que sai de verdade é decidido lá no Supabase, então
     o painel só descobre depois do primeiro teste. Guardo aqui para
     a prévia não mentir dizendo que sai do Gmail dela. */
  try{ pros.remetenteReal = localStorage.getItem('remetente-real') || ''; }catch(e){}

  function personalizar(texto, nomeDaMarca){
    const completo = String(nomeDaMarca || '').trim();
    const primeiro = completo.split(/\s+/)[0] || completo;
    return String(texto || '').split('{{nome}}').join(primeiro).split('{{marca}}').join(completo);
  }

  /* transforma endereço solto em link clicável */
  function linkar(t){
    return t.replace(/(https?:\/\/[^\s<]+)/g, function(u){
      return '<a href="' + u + '" style="color:#c74b34">' + u + '</a>';
    });
  }

  /* monta o e-mail limpo a partir do texto simples que ela escreveu */
  function montarEmailLimpo(texto, botaoTexto, botaoLink){
    const paragrafos = String(texto || '').split(/\n{2,}/).map(function(p){
      const corpo = linkar(escapar(p.trim()).split('\n').join('<br>'));
      return corpo ? '<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#2b2822">' + corpo + '</p>' : '';
    }).join('');

    const botao = (botaoTexto && botaoLink)
      ? '<p style="margin:26px 0"><a href="' + escapar(botaoLink) + '" ' +
        'style="display:inline-block;background:#c74b34;color:#ffffff;text-decoration:none;' +
        'padding:13px 26px;border-radius:999px;font-weight:700;font-size:15px">' +
        escapar(botaoTexto) + '</a></p>'
      : '';

    return '<div style="background:#ffffff;padding:26px 0;font-family:Helvetica,Arial,sans-serif">' +
             '<div style="max-width:560px;margin:0 auto;padding:0 20px">' +
               paragrafos + botao +
               '<p style="margin:30px 0 0;padding-top:14px;border-top:1px solid #eeeae0;' +
               'font-size:12px;line-height:1.5;color:#8d8779">' + RODAPE_SAIR + '</p>' +
             '</div>' +
           '</div>';
  }

  /* o html que vai sair, conforme o modo ligado na hora */
  function htmlParaEnviar(){
    return pros.modoTexto
      ? montarEmailLimpo(pros.texto, pros.botaoTexto, pros.botaoLink)
      : pros.htmlBruto;
  }

  /* tira as marcações para mostrar no modo rascunho e no Gmail */
  function textoSimples(html){
    return String(html || '')
      /* no rascunho não existe botão clicável, então o endereço
         precisa aparecer escrito, senão o link se perde */
      .replace(/<a[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi, function(_t, endereco, texto){
        const limpo = String(texto).replace(/<[^>]+>/g, '').trim();
        return (limpo && limpo !== endereco) ? limpo + ': ' + endereco : endereco;
      })
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/p>/gi, '\n\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;/g, "'").replace(/&quot;/g, '"')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  /* as opções de destinatário, lidas da tabela marcas */
  function opcoesDeDestino(){
    const comEmail = dados.marcas.filter(function(m){ return (m.email || '').trim(); });
    const selecionadas = comEmail.filter(function(m){ return m.selecionada; });

    const opcoes = [
      { v:'selecionadas', t:'só as marcas que eu selecionei (' + selecionadas.length + ')' },
      { v:'teste',        t:'só para mim, para testar (1)' },
      { v:'todas',        t:'todas as marcas com e-mail (' + comEmail.length + ')' }
    ];

    /* uma opção para cada situação que realmente existe no banco */
    const situacoesNoBanco = [];
    comEmail.forEach(function(m){
      const sit = (m.situacao || '').trim();
      if (sit && situacoesNoBanco.indexOf(sit) < 0){ situacoesNoBanco.push(sit); }
    });
    situacoesNoBanco.sort();
    situacoesNoBanco.forEach(function(sit){
      const quantas = comEmail.filter(function(m){ return m.situacao === sit; }).length;
      opcoes.push({ v:'sit:' + sit, t:'só ' + rotuloSituacao(sit).toLowerCase() + ' (' + quantas + ')' });
    });
    return opcoes;
  }

  /* devolve a lista pronta, já sem repetir e-mail e sem descadastrados */
  function listaDeDestino(){
    const comEmail = dados.marcas.filter(function(m){ return (m.email || '').trim(); });
    let base;
    if (pros.destino === 'teste'){
      return { lista:[{ email:EMAIL_CONTATO, nome:NOME_REMETENTE, id:null }], repetidos:0, pulados:0 };
    }
    if (pros.destino === 'selecionadas'){ base = comEmail.filter(function(m){ return m.selecionada; }); }
    else if (pros.destino === 'todas'){ base = comEmail; }
    else if (pros.destino.indexOf('sit:') === 0){
      const sit = pros.destino.slice(4);
      base = comEmail.filter(function(m){ return m.situacao === sit; });
    } else { base = []; }

    const foraDaLista = {};
    dados.optout.forEach(function(o){ foraDaLista[String(o.email || '').toLowerCase().trim()] = true; });

    const jaRecebeu = {};
    if (pros.pularJaRecebeu){
      dados.envios.forEach(function(e){
        if (e.status === 'ok'){
          jaRecebeu[String(e.email || '').toLowerCase() + '|' + String(e.assunto || '')] = true;
        }
      });
    }

    const vistos = {};
    const lista = [];
    let repetidos = 0, pulados = 0;

    base.forEach(function(m){
      const email = String(m.email || '').toLowerCase().trim();
      if (!email){ return; }
      if (vistos[email]){ repetidos++; return; }
      vistos[email] = true;
      if (foraDaLista[email]){ pulados++; return; }
      if (pros.pularJaRecebeu && jaRecebeu[email + '|' + personalizar(pros.assunto, m.nome)]){ pulados++; return; }
      lista.push({ email: email, nome: m.nome || '', id: m.id });
    });

    return { lista: lista, repetidos: repetidos, pulados: pulados };
  }

  function rotuloDoDestino(){
    const o = opcoesDeDestino().filter(function(x){ return x.v === pros.destino; })[0];
    return o ? o.t : pros.destino;
  }

  function desenharProspeccao(){
    $('#acaoDaAba').innerHTML = '';

    const comEmail = dados.marcas.filter(function(m){ return (m.email || '').trim(); });
    const enviadosOk = dados.envios.filter(function(e){ return e.status === 'ok'; });
    const comErro = dados.envios.filter(function(e){ return e.status === 'erro'; });
    const jaReceberam = {};
    enviadosOk.forEach(function(e){ jaReceberam[String(e.email || '').toLowerCase()] = true; });
    const quantosJa = Object.keys(jaReceberam).length;

    /* ---------- 1. a capa ---------- */
    let html = '<div class="capa-pros">' +
      '<div class="linha1">' +
        '<span class="selo-icone"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>' +
        '<div>' +
          '<h2>Prospecção</h2>' +
          '<p>Manda o seu e-mail de apresentação para várias marcas de uma vez, chamando cada uma pelo nome.</p>' +
        '</div>' +
        '<div class="total">' +
          '<div class="n">' + (dados.envios.length ? numero(enviadosOk.length) : '·') + '</div>' +
          '<div class="r">enviados até agora</div>' +
        '</div>' +
      '</div>' +
      '<div class="etiquetas">' +
        '<span>teste antes, sempre</span>' +
        '<span>a chave vive no Supabase</span>' +
        '<span>quem responde SAIR sai da lista</span>' +
      '</div>' +
    '</div>';

    /* ---------- 2. os cartões ---------- */
    const semTabela = avisos.some(function(a){ return a.tipo === 'falta-tabela' && (a.tabela === 'email_envios' || a.tabela === 'email_optout'); });
    html += '<div class="cartoes-pros">' +
      cartaoNum(numero(comEmail.length), 'com e-mail na base', dados.marcas.length + ' marcas no total', '') +
      cartaoNum(numero(Math.max(comEmail.length - quantosJa, 0)), 'a enviar', 'ainda não receberam nada', 'ambar') +
      cartaoNum(semTabela ? '·' : numero(quantosJa), 'já receberam', semTabela ? 'falta criar a tabela' : 'pelo menos um e-mail', 'verde') +
      cartaoNum(semTabela ? '·' : numero(comErro.length), 'falhas', 'e-mails que voltaram', 'vermelho') +
      cartaoNum(semTabela ? '·' : numero(dados.optout.length), 'descadastrados', 'responderam SAIR', 'azul') +
    '</div>';

    /* ---------- base sem e-mail nenhum ---------- */
    if (!comEmail.length){
      html += '<div class="caixa"><p class="vazio">A sua base ainda não tem nenhuma marca com e-mail preenchido, ' +
        'então não tem para quem mandar. Cadastre uma marca ou importe a sua planilha primeiro.</p>' +
        '<div style="text-align:center;margin-top:12px">' +
        '<button class="botao" type="button" id="irParaMarcas">ir para a aba Marcas</button></div></div>';
      $('#painel').innerHTML = html;
      $('#irParaMarcas').addEventListener('click', function(){ irPara('marcas'); });
      return;
    }

    /* ---------- 3. formulário e prévia ---------- */
    html += '<div class="pros-grade"><div>' + blocoFormulario() + '</div>' +
            '<div>' + blocoPalco() + '</div></div>';

    /* ---------- 4. histórico ---------- */
    html += blocoHistorico();

    $('#painel').innerHTML = html;
    ligarProspeccao();
  }

  function ligarProspeccao(){
    /* troca de modo de envio e de modo de escrita */
    $$('[data-motor]').forEach(function(b){
      b.addEventListener('click', function(){ pros.motor = b.dataset.motor; desenharProspeccao(); });
    });
    $$('[data-escrita]').forEach(function(b){
      b.addEventListener('click', function(){ pros.modoTexto = b.dataset.escrita === 'texto'; desenharProspeccao(); });
    });

    $('#destinoPros').addEventListener('change', function(){
      pros.destino = $('#destinoPros').value;
      if (pros.destino === 'selecionadas' && !listaDeDestino().lista.length){
        avisarSemSelecao();
      }
      desenharProspeccao();
    });
    $('#pularRecebidos').addEventListener('change', function(){
      pros.pularJaRecebeu = $('#pularRecebidos').checked;
      desenharProspeccao();
    });

    /* enquanto ela digita, só a prévia é redesenhada, senão o
       cursor pula do campo a cada letra */
    function ligarCampo(id, campo){
      const el = $(id);
      if (!el){ return; }
      el.addEventListener('input', function(){ pros[campo] = el.value; atualizarPalco(); });
    }
    ligarCampo('#assuntoPros', 'assunto');
    ligarCampo('#textoPros', 'texto');
    ligarCampo('#htmlPros', 'htmlBruto');
    ligarCampo('#botaoTextoPros', 'botaoTexto');
    ligarCampo('#botaoLinkPros', 'botaoLink');

    const btnModelo = $('#modeloPronto');
    if (btnModelo){
      btnModelo.addEventListener('click', function(){
        pros.htmlBruto = montarEmailLimpo(
          pros.texto || 'Oi {{nome}}, tudo bem?\n\nEscreva aqui o seu texto.\n\nUm abraço,\nLara',
          pros.botaoTexto, pros.botaoLink);
        desenharProspeccao();
      });
    }

    ligarPalco();

    const btnTeste = $('#enviarTeste');
    if (btnTeste){ btnTeste.addEventListener('click', enviarTeste); }
    const btnDisparar = $('#dispararPros');
    if (btnDisparar){ btnDisparar.addEventListener('click', confirmarDisparo); }
    const btnFila = $('#montarFila');
    if (btnFila){ btnFila.addEventListener('click', montarFilaRascunho); }

    const busca = $('#buscaHist');
    if (busca){
      busca.addEventListener('input', function(){
        pros.buscaHistorico = busca.value;
        const pos = busca.selectionStart;
        desenharProspeccao();
        const nova = $('#buscaHist');
        if (nova){ nova.focus(); try{ nova.setSelectionRange(pos,pos); }catch(e){} }
      });
    }
  }

  function atualizarPalco(){
    const palco = $('.palco');
    if (!palco){ return; }
    const novo = document.createElement('div');
    novo.innerHTML = blocoPalco();
    palco.replaceWith(novo.firstElementChild);
    ligarPalco();
  }

  function ligarPalco(){
    const btn = $('#verCheio');
    if (!btn){ return; }
    btn.addEventListener('click', function(){
      const conta = listaDeDestino();
      const exemplo = conta.lista[0] ? conta.lista[0].nome : 'Marca Exemplo';
      const fundo = document.createElement('div');
      fundo.className = 'fundo-cheio';
      fundo.innerHTML = '<div class="cheio-janela">' + cabecaDoEmail(exemplo) +
        '<div>' + personalizar(htmlParaEnviar(), exemplo) + '</div></div>' +
        '<button class="fechar" style="position:fixed;top:18px;right:18px" aria-label="Fechar">×</button>';
      document.body.appendChild(fundo);
      function fechar(){ fundo.remove(); document.removeEventListener('keydown', tecla); }
      function tecla(ev){ if (ev.key === 'Escape'){ fechar(); } }
      fundo.addEventListener('mousedown', function(ev){ if (ev.target === fundo){ fechar(); } });
      $('.fechar', fundo).addEventListener('click', fechar);
      document.addEventListener('keydown', tecla);
    });
  }

  /* ---------- falar com o carteiro ---------- */
  async function chamarCarteiro(destinatarios, assunto, html){
    try{
      const sessao = await sb.auth.getSession();
      const token = sessao && sessao.data && sessao.data.session ? sessao.data.session.access_token : '';
      const resposta = await fetch(window.BANCO.url + '/functions/v1/enviar-emails', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + token,
          'apikey': window.BANCO.chave,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ destinatarios: destinatarios, assunto: assunto, html: html })
      });
      const corpo = await resposta.json().catch(function(){ return {}; });
      return { ok: resposta.ok, corpo: corpo };
    }catch(e){
      return { ok:false, corpo:{ erro:'Não consegui falar com o carteiro. Confira se a função enviar-emails foi criada no Supabase.' } };
    }
  }

  function conferirAntesDeMandar(){
    if (!pros.assunto.trim()){ avisinho('Escreva o assunto primeiro.'); return false; }
    const corpo = pros.modoTexto ? pros.texto.trim() : pros.htmlBruto.trim();
    if (!corpo){ avisinho('Escreva o texto do e-mail primeiro.'); return false; }
    return true;
  }

  async function enviarTeste(){
    if (!conferirAntesDeMandar()){ return; }
    const botao = $('#enviarTeste');
    botao.disabled = true;
    botao.textContent = 'mandando...';
    const r = await chamarCarteiro(
      [{ email: EMAIL_CONTATO, nome: NOME_REMETENTE }], pros.assunto, htmlParaEnviar());
    botao.disabled = false;
    botao.textContent = 'enviar teste para mim';

    if (r.ok && r.corpo && r.corpo.remetente){
      pros.remetenteReal = r.corpo.remetente;
      try{ localStorage.setItem('remetente-real', pros.remetenteReal); }catch(e){}
    }
    if (!r.ok || r.corpo.erro){
      abrirJanela('Não deu para mandar o teste',
        '<p style="font-size:.88rem">' + escapar(r.corpo.erro || 'O carteiro recusou.') + '</p>' +
        '<div class="janela-pe"><button class="botao" type="button" data-fechar>fechar</button></div>');
      $$('[data-fechar]').forEach(function(b){ b.addEventListener('click', fecharJanela); });
      return;
    }
    await recarregarEnvios();
    abrirJanela('Teste enviado',

      'saindo de <b>' + escapar(enderecoDoRemetente() || 'um endereço do Resend') + '</b>.</p>' +
      '<p style="font-size:.86rem;color:var(--tinta-suave)">Abra no celular e confira se o nome da marca entrou ' +
      'nos lugares certos antes de disparar para valer.</p>' +
      '<div class="janela-pe"><button class="botao" type="button" data-fechar>fechar</button></div>');
    $$('[data-fechar]').forEach(function(b){ b.addEventListener('click', fecharJanela); });
    desenharProspeccao();
  }

  function confirmarDisparo(){
    if (!conferirAntesDeMandar()){ return; }
    const conta = listaDeDestino();

    if (!conta.lista.length){
      if (pros.destino === 'selecionadas'){ avisarSemSelecao(); }
      else { avisinho('Não sobrou ninguém nessa lista.'); }
      return;
    }

    /* no modo HTML o rodapé é responsabilidade dela */
    const semSair = !pros.modoTexto && pros.htmlBruto.toUpperCase().indexOf('SAIR') < 0;

    const fundo = abrirJanela('Confirmar o disparo',
      '<p style="font-size:.95rem">Vai para <b>' + conta.lista.length + '</b> ' +
      (conta.lista.length === 1 ? 'marca' : 'marcas') + ', da lista <b>' + escapar(rotuloDoDestino()) + '</b>.</p>' +
      '<p style="font-size:.88rem;color:var(--tinta-suave)">Assunto: ' + escapar(pros.assunto) + '</p>' +
      (semSair ? '<p class="tr-dica">O seu HTML não tem a palavra SAIR em lugar nenhum. ' +
        'Sem o rodapé de descadastro, quem receber não tem como pedir para sair da lista.</p>' : '') +
      '<p class="tr-dica" style="margin-top:10px">Depois de enviado não dá para desfazer.</p>' +
      '<div class="janela-pe"><button class="botao claro" type="button" data-fechar>cancelar</button>' +
      '<button class="botao" type="button" id="vaiAgora">sim, pode disparar</button></div>');
    $('#vaiAgora', fundo).addEventListener('click', function(){ dispararTudo(conta.lista); });
  }

  async function dispararTudo(lista){
    const assunto = pros.assunto;
    const html = htmlParaEnviar();
    const fundo = $('.fundo-janela');

    $('.janela', fundo).innerHTML =
      '<div class="janela-topo"><h2 class="janela-titulo">Disparando</h2></div>' +
      '<p id="andaEnvio" style="font-size:.88rem">0 de ' + lista.length + '</p>' +
      '<div class="trilho" style="margin-top:10px"><div class="cheio" id="barraEnvio" style="width:0%"></div></div>' +
      '<p style="font-size:.78rem;color:var(--apagado);margin-top:10px">' +
      'Vai devagar de propósito, cinco por segundo, que é o ritmo seguro. Não feche esta janela.</p>';

    const pedaco = 100;
    let enviados = 0, falhas = 0, pulados = 0, cotaAcabou = false, faltaram = 0, recado = '';
    const idsEnviados = [];

    for (let i = 0; i < lista.length; i += pedaco){
      const lote = lista.slice(i, i + pedaco);
      const r = await chamarCarteiro(lote.map(function(d){ return { email:d.email, nome:d.nome }; }), assunto, html);

      if (!r.ok || r.corpo.erro){
        recado = r.corpo.erro || 'O carteiro recusou o envio.';
        break;
      }
      enviados += r.corpo.enviados || 0;
      falhas   += r.corpo.falhas || 0;
      pulados  += r.corpo.pulados || 0;
      lote.forEach(function(d){ if (d.id){ idsEnviados.push(d.id); } });

      if (r.corpo.cotaAcabou){
        cotaAcabou = true;
        faltaram = (r.corpo.faltaram || 0) + (lista.length - Math.min(i + pedaco, lista.length));
        break;
      }
      const feito = Math.min(i + pedaco, lista.length);
      $('#andaEnvio').textContent = feito + ' de ' + lista.length;
      $('#barraEnvio').style.width = Math.round((feito / lista.length) * 100) + '%';
    }

    /* marca na tabela de marcas quem recebeu, com a data de hoje */
    if (idsEnviados.length){
      const hojeTexto = iso(hoje());
      for (let i = 0; i < idsEnviados.length; i += 25){
        const lote = idsEnviados.slice(i, i + 25);
        await Promise.all(lote.map(function(id){
          return sb.from('marcas').update({ enviado_em: hojeTexto }).eq('id', id)
            .then(function(){
              const m = dados.marcas.filter(function(x){ return x.id === id; })[0];
              if (m){ m.enviado_em = hojeTexto; }
            }, function(){});
        }));
      }
    }

    await recarregarEnvios();

    let fim = '<div class="janela-topo"><h2 class="janela-titulo">' +
      (recado ? 'O disparo parou' : 'Disparo terminado') + '</h2></div>';

    if (recado){
      fim += '<p class="tr-dica">' + escapar(recado) + '</p>';
    }
    fim += '<div class="faixa-numeros" style="margin:12px 0;border:0">' +
      bloco(numero(enviados), 'enviados') +
      bloco(numero(falhas), 'falhas') +
      bloco(numero(pulados), 'pulados') +
    '</div>';

    if (cotaAcabou){
      fim += '<p class="tr-dica"><b>A cota diária do Resend acabou.</b> ' +
        'Faltaram ' + faltaram + '. Volte amanhã, cole o mesmo assunto e o mesmo texto, ' +
        'deixe marcada a caixinha de pular quem já recebeu, e ele manda só para os que ficaram faltando.</p>';
    }

    fim += '<div class="janela-pe">' +
      (pros.destino === 'selecionadas'
        ? '<button class="botao claro" type="button" id="limparDepois">limpar a minha seleção</button>' : '') +
      '<button class="botao" type="button" data-fechar>fechar</button></div>';

    $('.janela', fundo).innerHTML = fim;
    $$('[data-fechar]', fundo).forEach(function(b){ b.addEventListener('click', fecharJanela); });
    const btnLimpar = $('#limparDepois', fundo);
    if (btnLimpar){
      btnLimpar.addEventListener('click', async function(){
        const alvo = dados.marcas.filter(function(m){ return m.selecionada; });
        btnLimpar.disabled = true;
        btnLimpar.textContent = 'limpando...';
        await mudarSelecao(alvo, false);
        fecharJanela();
        desenharProspeccao();
      });
    }
    desenharProspeccao();
  }

  async function recarregarEnvios(){
    dados.envios = await ler('email_envios', 'criado_em', false);
  }

  /* ---------- modo rascunho, o plano B sem Resend ---------- */
  function montarFilaRascunho(){
    if (!conferirAntesDeMandar()){ return; }
    const conta = listaDeDestino();
    if (!conta.lista.length){
      if (pros.destino === 'selecionadas'){ avisarSemSelecao(); }
      else { avisinho('Não sobrou ninguém nessa lista.'); }
      return;
    }
    pros.fila = conta.lista;
    pros.filaIndice = 0;
    desenharFila();
  }

    const restam = pros.fila.length;
    if (!restam){
      $('#painel').innerHTML = '<div class="caixa"><p class="vazio">Fila vazia, você mandou todas. ' +
        'Cada uma já ficou marcada como enviada na sua base.</p>' +

    const linkGmail = 'https://mail.google.com/mail/?view=cm&fs=1' +
      '&to=' + encodeURIComponent(d.email) +

        '<p class="caixa-titulo" style="margin:0">fila de rascunhos · faltam ' + restam + '</p>' +
        '<span style="flex:1"></span>' +
        '<button class="chip" type="button" id="pularEsta">pular esta</button>' +
        '<button class="chip" type="button" id="sairDaFila">sair da fila</button>' +
      '</div></div>' +
      '<div class="fila-item">' +
        '<h4>' + escapar(d.nome || 'sem nome') + '</h4>' +
        '<p class="para">para ' + escapar(d.email) + '</p>' +
        '<p style="font-size:.86rem;font-weight:700;margin:12px 0 0">' + escapar(assunto) + '</p>' +
        '<div class="fila-corpo">' + escapar(corpoTexto) + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="botao claro" type="button" id="copiarCorpo">copiar o texto</button>' +
          '<a class="botao claro" href="' + escapar(linkGmail) + '" target="_blank" rel="noopener" ' +
            'style="text-decoration:none">abrir no Gmail</a>' +
          '<button class="botao" type="button" id="marcarEnviada">marquei como enviada</button>' +
        '</div>' +
      '</div>';

    $('#pularEsta').addEventListener('click', function(){ pros.fila.shift(); desenharFila(); });
    $('#sairDaFila').addEventListener('click', function(){ pros.fila = null; desenharProspeccao(); });
    $('#copiarCorpo').addEventListener('click', function(){
      copiarParaAreaDeTransferencia(corpoTexto, true);
    });
    $('#marcarEnviada').addEventListener('click', async function(){
      const botao = $('#marcarEnviada');
      botao.disabled = true;
      botao.textContent = 'anotando...';
      const hojeTexto = iso(hoje());
      try{
        await sb.from('email_envios').insert({
          email: d.email, assunto: assunto, status: 'ok', erro: '', resend_id: 'rascunho'
        });
      }catch(e){}
      if (d.id){
        try{
          await sb.from('marcas').update({ enviado_em: hojeTexto }).eq('id', d.id);
          const m = dados.marcas.filter(function(x){ return x.id === d.id; })[0];
          if (m){ m.enviado_em = hojeTexto; }
        }catch(e){}
      }
      await recarregarEnvios();
      pros.fila.shift();
      desenharFila();
    });
  }

  }

  function cabecaDoEmail(exemplo){
    const de = pros.motor === 'rascunho'
      ? EMAIL_CONTATO
      : (enderecoDoRemetente() || 'endereço do Resend');

        '<span class="email-de" style="display:block">' + escapar(NOME_REMETENTE) + ' &lt;' +

        (pros.motor === 'rascunho' ? '' :
          '<span class="email-de" style="display:block">responder vai para ' + escapar(EMAIL_CONTATO) + '</span>') +
      '</span>' +

  }

  /* tira só o endereço de dentro de algo como Nome <x@y.com> */
  function enderecoDoRemetente(){
    const m = String(pros.remetenteReal || '').match(/<([^>]+)>/);
    return m ? m[1] : (pros.remetenteReal || '');
  }

  function blocoHistorico(){
    const busca = semAcento(pros.buscaHistorico);
    const lista = dados.envios.filter(function(e){
      if (!busca){ return true; }
      return semAcento((e.email || '') + ' ' + (e.assunto || '')).indexOf(busca) >= 0;
    });

    let html = '<div class="caixa" style="margin-top:18px">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +

        '<span style="flex:1"></span>' +
        '<input class="busca" id="buscaHist" type="search" placeholder="buscar por e-mail ou assunto" ' +
        'value="' + escapar(pros.buscaHistorico) + '" style="max-width:260px">' +
      '</div>';

    if (!dados.envios.length){
      html += '<p class="vazio">Nenhum e-mail saiu ainda. Quando o primeiro disparo acontecer, cada destinatário ' +
        'vira uma linha aqui, com a data e se deu certo. É isso que te permite saber quem recebeu se um disparo parar no meio.</p>';
    } else if (!lista.length){

      html += '<div class="planilha-previa"><table><thead><tr>' +
