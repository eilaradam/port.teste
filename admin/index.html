      bloco(numero(ativas.length), 'ativas agora') +
      bloco(dinheiro(totalValor), 'valor total', totalQtd > 0 ? dinheiro(ticket) + ' por vídeo' : 'sem vídeo somado ainda') +
      bloco(dinheiro(aReceber), 'a receber', dinheiro(recebido) + ' já recebido') +
      '</div>';

    let lista = todas.filter(function(c){
      if (filtroCampanha === 'ativas' && c.ativa === false){ return false; }
      if (filtroCampanha === 'finalizadas' && c.ativa !== false){ return false; }
      if (!buscaCampanha){ return true; }
      const alvo = semAcento((c.campanha||'') + ' ' + (c.cliente||'') + ' ' + (c.status||''));
      return alvo.indexOf(semAcento(buscaCampanha)) >= 0;
    });

    lista = lista.slice().sort(function(a,b){
      let x, y;
      if (ordemCol === 'status'){ x = FUNIL.indexOf(a.status); y = FUNIL.indexOf(b.status); }
      else if (ordemCol === 'valor' || ordemCol === 'qtd'){ x = Number(a[ordemCol]) || 0; y = Number(b[ordemCol]) || 0; }
      else if (ordemCol === 'prazo'){
        x = a.prazo ? deISO(a.prazo).getTime() : Infinity;
        y = b.prazo ? deISO(b.prazo).getTime() : Infinity;
      }
      else if (ordemCol === 'favorita'){ x = a.favorita ? 1 : 0; y = b.favorita ? 1 : 0; }
      else { x = semAcento(a[ordemCol]); y = semAcento(b[ordemCol]); }
      if (x < y){ return ordemAsc ? -1 : 1; }
      if (x > y){ return ordemAsc ? 1 : -1; }
      return 0;
    });

    html += '<div class="barra-ferramentas">' +
      '<input class="busca" id="buscaCampanha" type="search" placeholder="buscar campanha ou cliente" value="' + escapar(buscaCampanha) + '">' +
      ['todas','ativas','finalizadas'].map(function(f){
        return '<button class="chip" type="button" data-fc="' + f + '" aria-pressed="' + (filtroCampanha===f) + '">' + f + '</button>';
      }).join('') + '</div>';

    html += '<div class="caixa">';
    if (!todas.length){
      html += '<p class="vazio">Nenhuma campanha ainda. Clique em "+ nova campanha" para registrar o primeiro trabalho fechado.</p>';
    } else if (!lista.length){
      html += '<p class="vazio">Nenhuma campanha com esse filtro.</p>';
    } else {
      const colunas = [
        {c:'favorita', t:''}, {c:'campanha', t:'campanha'}, {c:'cliente', t:'cliente'},
        {c:'tipo', t:'tipo'}, {c:'status', t:'status'}, {c:'qtd', t:'qtd'},
        {c:'valor', t:'valor'}, {c:'prazo', t:'prazo'}, {c:'pagamento', t:'pagamento'}
      ];
      html += '<div class="rolagem"><table><thead><tr>' +
        colunas.map(function(col){
          const ativa = ordemCol === col.c;
          const seta = ativa ? (ordemAsc ? '&#9650;' : '&#9660;') : '&#9671;';
          return '<th class="ordena' + (ativa ? ' ordena-ativa' : '') + '" data-col="' + col.c + '" ' +
                 'title="clique para ordenar">' + escapar(col.t) + '<span class="seta">' + seta + '</span></th>';
        }).join('') + '<th></th></tr></thead><tbody>' +
        lista.map(function(c){ return linhaCampanha(c); }).join('') +
        '</tbody></table></div>';
    }
    html += '</div>';

    $('#painel').innerHTML = html;

    $('#novaCampanha').addEventListener('click', function(){ formCampanha(null); });
    $('#baixarCampanhas').addEventListener('click', function(){ baixarCSV('campanhas', lista); });
    const busca = $('#buscaCampanha');
    busca.addEventListener('input', function(){
      buscaCampanha = busca.value;
      const pos = busca.selectionStart;
      desenharCampanhas();
      const nova = $('#buscaCampanha');
      nova.focus();
      try{ nova.setSelectionRange(pos,pos); }catch(e){}
    });
    $$('[data-fc]').forEach(function(b){
      b.addEventListener('click', function(){ filtroCampanha = b.dataset.fc; desenharCampanhas(); });
    });
    $$('[data-col]').forEach(function(th){
      th.addEventListener('click', function(){
        const col = th.dataset.col;
        if (ordemCol === col){ ordemAsc = !ordemAsc; } else { ordemCol = col; ordemAsc = true; }
        desenharCampanhas();
      });
    });
    $$('[data-estrela]').forEach(function(b){
      b.addEventListener('click', async function(ev){
        ev.stopPropagation();
        const c = dados.campanhas.filter(function(x){ return String(x.id) === b.dataset.estrela; })[0];
        if (!c){ return; }
        const novo = !c.favorita;
        const r = await gravar('campanhas', { id:c.id, favorita:novo });
        if (r.ok){ c.favorita = novo; desenharCampanhas(); }
      });
    });
    $$('[data-campanha]').forEach(function(tr){
      tr.addEventListener('click', function(ev){
        if (ev.target.closest('[data-parar]')){ return; }
        const c = dados.campanhas.filter(function(x){ return String(x.id) === tr.dataset.campanha; })[0];
        formCampanha(c);
      });
    });
  }

  function linhaCampanha(c){
    const h = hoje();
    let aviso = '';
    /* o que já foi entregue não recebe aviso de prazo */
    if (c.prazo && c.status !== 'Entregue'){
      const d = deISO(c.prazo);
      if (d){
        const faltam = diasEntre(h, d);
        if (faltam < 0){
          aviso = '<span class="etiqueta e-atraso">' + Math.abs(faltam) + (Math.abs(faltam)===1 ? ' dia atrasado' : ' dias atrasado') + '</span>';
        } else if (faltam <= 3){
          aviso = '<span class="etiqueta e-perto">' + (faltam === 0 ? 'vence hoje' : 'faltam ' + faltam + (faltam===1?' dia':' dias')) + '</span>';
        }
      }
    }
    const posFunil = FUNIL.indexOf(c.status) + 1;
    return '<tr class="clicavel ' + (c.favorita ? 'favorita' : '') + '" data-campanha="' + c.id + '">' +
      '<td><button class="estrela ' + (c.favorita ? 'marcada' : '') + '" type="button" data-estrela="' + c.id + '" data-parar ' +
        'aria-label="' + (c.favorita ? 'Tirar o destaque' : 'Destacar') + '">' +
        '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button></td>' +
      '<td><strong>' + escapar(c.campanha || 'sem nome') + '</strong></td>' +
      '<td>' + escapar(c.cliente || '') + '</td>' +
      '<td><span class="pilula p-' + (c.tipo === 'Publicidade' ? 'publicidade' : 'conteudo') + '">' + escapar(c.tipo || '') + '</span></td>' +
      '<td><span class="pilula p-f' + (posFunil > 0 ? posFunil : 1) + '">' + escapar(c.status || '') + '</span></td>' +
      '<td>' + numero(c.qtd) + '</td>' +
      '<td>' + dinheiro(c.valor) + '</td>' +
      '<td>' + (c.prazo ? escapar(dataCurta(c.prazo)) : '<span style="color:var(--apagado)">·</span>') + aviso + '</td>' +
      '<td><span class="pilula p-' + (c.pagamento === 'pago' ? 'pago' : 'pendente') + '">' + escapar(c.pagamento || 'pendente') + '</span></td>' +
      '<td class="acoes"><button class="mini perigo" type="button" data-parar data-apagar-camp="' + c.id + '" aria-label="Apagar">' +
        '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td>' +
      '</tr>';
  }

  function formCampanha(c){
    const novo = !c;
    c = c || { campanha:'', cliente:'', tipo:'Conteúdo', status:'Briefing', qtd:1, valor:0, prazo:'', pagamento:'pendente', ativa:true, favorita:false };
    const fundo = abrirJanela(novo ? 'Nova campanha' : 'Editar campanha',
      '<form id="formCampanha">' +
        campoTexto('cNome','campanha', c.campanha) +
        campoTexto('cCliente','cliente', c.cliente) +
        '<div class="dupla">' +
          campoLista('cTipo','tipo', c.tipo, ['Conteúdo','Publicidade']) +
          campoLista('cStatus','status', c.status, FUNIL) +
        '</div>' +
        '<div class="dupla">' +
          campoTexto('cQtd','quantos vídeos', c.qtd, 'number') +
          campoTexto('cValor','valor em reais', c.valor, 'number') +
        '</div>' +
        '<div class="dupla">' +
          campoTexto('cPrazo','prazo', c.prazo ? String(c.prazo).slice(0,10) : '', 'date') +
          campoLista('cPagamento','pagamento', c.pagamento, [{v:'pendente',t:'pendente'},{v:'pago',t:'pago'}]) +
        '</div>' +
        campoLista('cAtiva','está ativa?', c.ativa === false ? 'nao' : 'sim', [{v:'sim',t:'sim, em andamento'},{v:'nao',t:'não, finalizada'}]) +
        '<div class="janela-pe">' +
          '<button class="botao claro" type="button" data-fechar>Cancelar</button>' +
          '<button class="botao" type="submit">' + (novo ? 'Adicionar' : 'Salvar') + '</button>' +
        '</div>' +
      '</form>');

    $('#formCampanha', fundo).addEventListener('submit', async function(ev){
      ev.preventDefault();
      const registro = {
        campanha: $('#cNome').value.trim(),
        cliente:  $('#cCliente').value.trim(),
        tipo:     $('#cTipo').value,
        status:   $('#cStatus').value,
        qtd:      Number($('#cQtd').value) || 0,
        valor:    Number($('#cValor').value) || 0,
        prazo:    $('#cPrazo').value || null,
        pagamento:$('#cPagamento').value,
        ativa:    $('#cAtiva').value === 'sim'
      };
      if (!novo){ registro.id = c.id; }
      const r = await gravar('campanhas', registro);
      if (!r.ok){ return; }
      if (novo && r.linha){ dados.campanhas.unshift(r.linha); }
      else { Object.assign(c, registro); }
      fecharJanela();
      avisinho(novo ? 'Campanha adicionada.' : 'Campanha salva.');
      desenharCampanhas();
    });
  }

  document.addEventListener('click', function(ev){
    const b = ev.target.closest('[data-apagar-camp]');
    if (!b){ return; }
    ev.stopPropagation();
    const c = dados.campanhas.filter(function(x){ return String(x.id) === b.dataset.apagarCamp; })[0];
    if (!c){ return; }
    confirmar('Apagar a campanha ' + (c.campanha || '') + '?', async function(){
      if (await apagar('campanhas', c.id)){
        dados.campanhas = dados.campanhas.filter(function(x){ return x.id !== c.id; });
        avisinho('Campanha apagada.');
        desenharCampanhas();
      }
    });
  });

  /* =====================================================================
     ABA · TRANSCRIÇÕES
     O TokScript é um site, não tem uma porta de entrada que eu possa
     chamar daqui de dentro. Então o caminho é: abrir lá, copiar o
     roteiro e colar aqui. O painel guarda tudo junto do vídeo.
     ===================================================================== */
  const TOKSCRIPT = 'https://tokscript.com';
  let telaTranscricao = 'lista';
  let transcricaoAberta = null;
  let buscaTranscricao = '';
  let ladoEsquerdo = 'video';

  function plataformaDoLink(link){
    const l = String(link || '').toLowerCase();
    if (l.indexOf('tiktok.com') >= 0){ return 'tiktok'; }
    if (l.indexOf('instagram.com') >= 0){ return 'instagram'; }
    if (l.indexOf('youtube.com') >= 0 || l.indexOf('youtu.be') >= 0){ return 'youtube'; }
    return 'outro';
  }

  /* monta o endereço que dá para mostrar dentro de um quadrinho */
  function enderecoParaVer(link){
    const p = plataformaDoLink(link);
    if (p === 'youtube'){
      const id = idDoYoutube(link);
      return id ? { url:'https://www.youtube-nocookie.com/embed/' + id, alto:false } : null;
    }
    if (p === 'tiktok'){
      const m = String(link).match(/video\/(\d+)/) || String(link).match(/\/(\d{15,})/);
      return m ? { url:'https://www.tiktok.com/embed/v2/' + m[1], alto:true } : null;
    }
    if (p === 'instagram'){
      const m = String(link).match(/instagram\.com\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
      if (!m){ return null; }
      const tipo = m[1] === 'reels' ? 'reel' : m[1];
      return { url:'https://www.instagram.com/' + tipo + '/' + m[2] + '/embed', alto:true };
    }
    return null;
  }

  /* copiar sem deixar promessa solta: o navegador recusa quando a
     janela não está em foco, e isso não pode virar erro na tela */
  function copiarParaAreaDeTransferencia(texto, avisar){
    try{
      navigator.clipboard.writeText(texto).then(
        function(){ if (avisar){ avisinho('Link copiado.'); } },
        function(){ if (avisar){ avisinho('Não consegui copiar. Selecione o link no campo e use Cmd+C.'); } }
      );
    }catch(e){
      if (avisar){ avisinho('Não consegui copiar. Selecione o link no campo e use Cmd+C.'); }
    }
  }

  function capaDaTranscricao(link){
    if (plataformaDoLink(link) !== 'youtube'){ return ''; }
    const id = idDoYoutube(link);
    return id ? 'https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg' : '';
  }

  function desenharTranscricoes(){
    if (telaTranscricao === 'detalhe' && transcricaoAberta){ telaDetalheTranscricao(); return; }
    telaListaTranscricoes();
  }

  function telaListaTranscricoes(){
    $('#acaoDaAba').innerHTML =
      '<a class="botao claro" href="' + TOKSCRIPT + '" target="_blank" rel="noopener" ' +
      'style="text-decoration:none">abrir o TokScript</a>';

    const lista = dados.transcricoes.filter(function(t){
      if (!buscaTranscricao){ return true; }
      const alvo = semAcento((t.titulo||'') + ' ' + (t.obs||'') + ' ' + (t.transcricao||'') + ' ' + (t.link||''));
      return alvo.indexOf(semAcento(buscaTranscricao)) >= 0;
    });

    let html = '<div class="caixa"><p class="caixa-titulo">guardar um conteúdo novo</p>' +
      '<div class="barra-ferramentas" style="margin:0">' +
        '<input class="busca" id="linkNovo" type="url" placeholder="cole aqui o link do YouTube, Instagram ou TikTok">' +
        '<button class="botao" type="button" id="guardarLink">guardar</button>' +
      '</div>' +
      '<div style="margin-top:12px">' +
        '<div class="passo"><span class="n">1</span><span>Cole o link aqui em cima e clique em guardar. O vídeo já aparece para você assistir.</span></div>' +
        '<div class="passo"><span class="n">2</span><span>Dentro do conteúdo, clique em "pegar o roteiro no TokScript". Ele abre em outra aba com o link junto.</span></div>' +
        '<div class="passo"><span class="n">3</span><span>Copie a transcrição de lá, cole no campo do roteiro, escreva as suas observações e salve.</span></div>' +
      '</div></div>';

    html += '<div class="barra-ferramentas">' +
      '<input class="busca" id="buscaTr" type="search" placeholder="buscar por título, roteiro ou anotação" value="' + escapar(buscaTranscricao) + '">' +
      '</div>';

    if (!dados.transcricoes.length){
      html += '<p class="vazio">Você ainda não guardou nenhum conteúdo. Cole o primeiro link aí em cima. ' +
              'A ideia é juntar os vídeos que te inspiram com o roteiro deles escrito, para consultar na hora de gravar o seu.</p>';
    } else if (!lista.length){
      html += '<p class="vazio">Nenhum conteúdo com essa busca.</p>';
    } else {
      html += '<div class="grade-transcricoes">' + lista.map(function(t){
        const capa = capaDaTranscricao(t.link);
        const plat = plataformaDoLink(t.link);
        return '<button class="cartao-tr' + (t.favorita ? ' favorita' : '') + '" type="button" data-tr="' + t.id + '">' +
          (capa ? '<span class="tr-capa"><img src="' + escapar(capa) + '" alt="" loading="lazy" decoding="async"></span>' : '') +
          '<span class="tr-corpo" style="display:block">' +
            '<span class="pilula p-' + plat + '">' + plat + '</span>' +
            (t.favorita ? ' <span class="pilula p-pendente">favorito</span>' : '') +
            '<h4 style="margin-top:7px">' + escapar(t.titulo || 'sem título') + '</h4>' +
            '<p>' + escapar(t.obs || t.transcricao || 'sem roteiro salvo ainda') + '</p>' +
          '</span></button>';
      }).join('') + '</div>' +
      '<p style="margin-top:12px;font-size:.78rem;color:var(--apagado)">' + lista.length + ' de ' + dados.transcricoes.length + ' conteúdos guardados.</p>';
    }

    $('#painel').innerHTML = html;

    $('#guardarLink').addEventListener('click', guardarLinkNovo);
    $('#linkNovo').addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); guardarLinkNovo(); }
    });
    const busca = $('#buscaTr');
    busca.addEventListener('input', function(){
      buscaTranscricao = busca.value;
      const pos = busca.selectionStart;
      telaListaTranscricoes();
      const nova = $('#buscaTr');
      nova.focus();
      try{ nova.setSelectionRange(pos,pos); }catch(e){}
    });
    $$('[data-tr]').forEach(function(b){
      b.addEventListener('click', function(){
        transcricaoAberta = dados.transcricoes.filter(function(x){ return String(x.id) === b.dataset.tr; })[0];
        telaTranscricao = 'detalhe';
        desenharTranscricoes();
      });
    });
  }

  async function guardarLinkNovo(){
    const campo = $('#linkNovo');
    const link = campo.value.trim();
    if (!link){ avisinho('Cole um link primeiro.'); campo.focus(); return; }

    const registro = {
      link: link,
      plataforma: plataformaDoLink(link),
      titulo: '',
      transcricao: '',
      obs: '',
      favorita: false
    };
    const r = await gravar('transcricoes', registro);
    if (!r.ok){ return; }
    if (r.linha){ dados.transcricoes.unshift(r.linha); transcricaoAberta = r.linha; }
    avisinho('Conteúdo guardado. Agora pegue o roteiro.');
    telaTranscricao = 'detalhe';
    desenharTranscricoes();
  }

  function telaDetalheTranscricao(){
    const t = transcricaoAberta;
    const ver = enderecoParaVer(t.link);
    const plat = plataformaDoLink(t.link);

    $('#acaoDaAba').innerHTML = '<button class="botao claro" type="button" id="voltarLista">voltar para a lista</button>';

    let html = '<div class="tr-detalhe">' +
      '<div>' +
        '<div class="tr-abas">' +
          '<button class="chip" type="button" data-lado="video" aria-pressed="' + (ladoEsquerdo==='video') + '">o vídeo</button>' +
          '<button class="chip" type="button" data-lado="transcrever" aria-pressed="' + (ladoEsquerdo==='transcrever') + '">transcrever</button>' +
        '</div>' +
        '<div id="ladoEsquerdo"></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
          '<a class="botao claro" href="' + escapar(t.link) + '" target="_blank" rel="noopener" style="text-decoration:none">abrir o original</a>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
          '<span class="pilula p-' + plat + '">' + plat + '</span>' +
          '<button class="estrela ' + (t.favorita ? 'marcada' : '') + '" type="button" id="favoritarTr" ' +
            'aria-label="' + (t.favorita ? 'Tirar dos favoritos' : 'Marcar como favorito') + '">' +
            '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>' +
          '<span style="flex:1"></span>' +
          '<button class="botao claro" type="button" id="apagarTr">apagar</button>' +
        '</div>' +
        campoTexto('trTitulo','título (como você quer lembrar dele)', t.titulo) +
        campoTexto('trLink','link', t.link, 'url') +
        '<div class="campo">' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">' +
            '<label for="trTranscricao" style="margin:0">roteiro (a transcrição)</label>' +
            '<span style="flex:1"></span>' +
            '<button class="botao claro" type="button" id="colarRoteiro" style="padding:4px 12px;font-size:.76rem">colar</button>' +
          '</div>' +
          '<textarea class="transcricao" id="trTranscricao" placeholder="Copie o roteiro no quadro da esquerda e clique em colar, ou use Cmd+V aqui.">' + escapar(t.transcricao || '') + '</textarea></div>' +
        '<div class="campo"><label for="trObs">as minhas observações</label>' +
          '<textarea id="trObs" style="min-height:110px" placeholder="O que funcionou aqui? O gancho, o corte, a fala? O que dá para adaptar para a sua marca?">' + escapar(t.obs || '') + '</textarea></div>' +
        '<div class="janela-pe" style="justify-content:flex-start">' +
          '<button class="botao" type="button" id="salvarTr">salvar</button>' +
          '<span class="salvo-em" id="salvoEm"></span>' +
        '</div>' +
      '</div>' +
    '</div>';

    $('#painel').innerHTML = html;

    $('#voltarLista').addEventListener('click', function(){
      telaTranscricao = 'lista';
      transcricaoAberta = null;
      desenharTranscricoes();
    });

    /* desenha a coluna da esquerda: ou o vídeo, ou o TokScript.
       O quadro do TokScript só é criado quando ela pede, para a
       página não ficar pesada à toa. O sandbox deixa o site deles
       funcionar mas proíbe que ele tire você do painel. */
    function desenharLadoEsquerdo(){
      const caixa = $('#ladoEsquerdo');
      if (ladoEsquerdo === 'transcrever'){
        /* Tentei encaixar o TokScript aqui dentro numa moldura e não
           funciona: o site deles não roda dentro de moldura, a área
           fica em branco. Então a janelinha flutuante é o mais perto
           que dá de não te tirar do painel: o admin fica aberto atrás,
           sem perder nada do que você escreveu. */
        caixa.innerHTML =
          '<p class="tr-dica">O TokScript abre numa janelinha por cima, e o painel fica aqui atrás, ' +
          'do jeitinho que você deixou. Copie o roteiro lá e volte.</p>' +
          '<div class="passo"><span class="n">1</span><span>Clique no botão abaixo. O link já vai copiado.</span></div>' +
          '<div class="passo"><span class="n">2</span><span>Cole no campo do TokScript e espere o roteiro.</span></div>' +
          '<div class="passo"><span class="n">3</span><span>Copie o roteiro, feche a janelinha e clique em <b>colar</b>, no campo do lado.</span></div>' +
          '<button class="botao" type="button" id="abrirJanelinha" style="width:100%;margin-top:12px">' +
          'abrir o TokScript numa janelinha</button>' +
          '<button class="botao claro" type="button" id="copiarLink" style="width:100%;margin-top:8px">' +
          'copiar só o link do vídeo</button>';

        $('#abrirJanelinha').addEventListener('click', function(){
          const endereco = (plat === 'instagram'
            ? TOKSCRIPT + '/instagram-transcript-generator'
            : TOKSCRIPT) + '?url=' + encodeURIComponent(t.link);
          copiarParaAreaDeTransferencia(t.link);
          window.open(endereco, 'tokscript', 'width=540,height=800,noopener');
        });
        $('#copiarLink').addEventListener('click', function(){
          copiarParaAreaDeTransferencia(t.link, true);
        });
      } else {
        caixa.innerHTML = ver
          ? '<div class="tr-video ' + (ver.alto ? 'alto' : 'vertical') + '">' +
              '<iframe src="' + escapar(ver.url) + '" title="Conteúdo guardado" loading="lazy" ' +
              'allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
            '</div>'
          : '<div class="tr-sem-preview">Não consegui montar a janelinha do vídeo para este link. ' +
            'Use o botão abaixo para abrir no site de origem.</div>';
      }
    }
    desenharLadoEsquerdo();

    $$('[data-lado]').forEach(function(b){
      b.addEventListener('click', function(){
        ladoEsquerdo = b.dataset.lado;
        $$('[data-lado]').forEach(function(o){ o.setAttribute('aria-pressed', String(o.dataset.lado === ladoEsquerdo)); });
        desenharLadoEsquerdo();
      });
    });

    /* botão colar: lê o que está na área de transferência e joga no campo */
    $('#colarRoteiro').addEventListener('click', async function(){
      const campo = $('#trTranscricao');
      try{
        const texto = await navigator.clipboard.readText();
        if (!texto){ avisinho('Não tem nada copiado ainda.'); return; }
        campo.value = texto;
        campo.dispatchEvent(new Event('input'));
        avisinho('Roteiro colado.');
      }catch(e){
        campo.focus();
        avisinho('O navegador pediu permissão. Se preferir, clique no campo e aperte Cmd+V.');
      }
    });

    /* salva sozinho enquanto ela escreve, para não perder trabalho */
    let relogioSalvar = null;
    function salvarSozinho(){
      clearTimeout(relogioSalvar);
      $('#salvoEm').textContent = 'escrevendo...';
      relogioSalvar = setTimeout(function(){ salvarTranscricao(true); }, 1400);
    }
    $('#trTranscricao').addEventListener('input', salvarSozinho);
    $('#trObs').addEventListener('input', salvarSozinho);
    $('#trTitulo').addEventListener('input', salvarSozinho);

    $('#favoritarTr').addEventListener('click', async function(){
      const novo = !t.favorita;
      const r = await gravar('transcricoes', { id:t.id, favorita:novo });
      if (r.ok){ t.favorita = novo; desenharTranscricoes(); }
    });

    $('#apagarTr').addEventListener('click', function(){
      confirmar('Apagar ' + (t.titulo || 'este conteúdo') + ' e o roteiro dele?', async function(){
        if (await apagar('transcricoes', t.id)){
          dados.transcricoes = dados.transcricoes.filter(function(x){ return x.id !== t.id; });
          telaTranscricao = 'lista';
          transcricaoAberta = null;
          avisinho('Conteúdo apagado.');
          desenharTranscricoes();
        }
      });
    });

    async function salvarTranscricao(silencioso){
      const registro = {
        id: t.id,
        titulo: $('#trTitulo').value.trim(),
        link: $('#trLink').value.trim(),
        plataforma: plataformaDoLink($('#trLink').value.trim()),
        transcricao: $('#trTranscricao').value,
        obs: $('#trObs').value
      };
      const r = await gravar('transcricoes', registro);
      if (!r.ok){ $('#salvoEm').textContent = 'não consegui salvar'; return; }
      Object.assign(t, registro);
      const agora = new Date();
      $('#salvoEm').textContent = 'salvo às ' +
        String(agora.getHours()).padStart(2,'0') + ':' + String(agora.getMinutes()).padStart(2,'0');
      if (!silencioso){ avisinho('Salvo.'); desenharTranscricoes(); }
    }

    $('#salvarTr').addEventListener('click', function(){ salvarTranscricao(false); });
  }

  /* =====================================================================
     ABA 5 · CHECKLIST
     Todo o conteúdo vem do arquivo js/biblioteca.js, sem mudar nada.
     ===================================================================== */
  let subAbaCl = 'checklist';
  const SUB_ABAS = [
    { v:'checklist',   t:'Checklist do portfólio' },
    { v:'referencias', t:'Referências de vídeo' },
    { v:'roteiros',    t:'Roteiros' },
    { v:'ideias',      t:'Ideias por nicho' },
    { v:'revisao',     t:'Revisar meu roteiro' }
  ];
  const abertas = {};

  function B(){ return window.Biblioteca || {}; }

  function desenharChecklist(){
    $('#acaoDaAba').innerHTML = '';
    let html = '<div class="sub-abas">' + SUB_ABAS.map(function(s){
      return '<button class="chip" type="button" data-sub="' + s.v + '" aria-pressed="' + (subAbaCl===s.v) + '">' + s.t + '</button>';
    }).join('') + '</div><div id="corpoCl"></div>';
    $('#painel').innerHTML = html;
    $$('[data-sub]').forEach(function(b){
      b.addEventListener('click', function(){ subAbaCl = b.dataset.sub; desenharChecklist(); });
    });

    if (!window.Biblioteca){
      $('#corpoCl').innerHTML = '<p class="vazio">O arquivo js/biblioteca.js não carregou, então não tenho o conteúdo para mostrar aqui. ' +
        'Confira se o arquivo está na pasta js do projeto.</p>';
      return;
    }
    if (subAbaCl === 'checklist'){ subChecklist(); }
    else if (subAbaCl === 'referencias'){ subReferencias(); }
    else if (subAbaCl === 'roteiros'){ subRoteiros(); }
    else if (subAbaCl === 'ideias'){ subIdeias(); }
    else { subRevisao(); }
  }

  function subChecklist(){
    const secoes = B().CHECKLIST || [];
    let totalItens = 0, totalFeitos = 0;
    secoes.forEach(function(s){
      (s.itens||[]).forEach(function(_it, i){
        totalItens++;
        if (dados.marcados[s.id + '-' + i]){ totalFeitos++; }
      });
    });
    const parteGeral = totalItens > 0 ? Math.round((totalFeitos/totalItens)*100) : 0;

    let html = '<div class="caixa"><p class="caixa-titulo">o portfólio inteiro</p>' +
      '<div style="display:flex;align-items:center;gap:12px">' +
        '<span class="trilho" style="flex:1"><span class="cheio" style="width:' + parteGeral + '%"></span></span>' +
        '<strong style="font-size:.85rem">' + totalFeitos + ' de ' + totalItens + '</strong>' +
      '</div></div>';

    html += secoes.map(function(s){
      const itens = s.itens || [];
      const feitos = itens.filter(function(_it,i){ return dados.marcados[s.id + '-' + i]; }).length;
      const parte = itens.length > 0 ? Math.round((feitos/itens.length)*100) : 0;
      const aberta = !!abertas['cl-' + s.id];
      return '<div class="secao-cl">' +
        '<button class="secao-cabeca" type="button" data-abre="cl-' + escapar(s.id) + '" aria-expanded="' + aberta + '">' +
          '<span class="secao-emoji" aria-hidden="true">' + escapar(s.emoji || '') + '</span>' +
          '<span><span class="secao-nome">' + escapar(s.nome || '') + '</span>' +
          '<span class="secao-resumo" style="display:block">' + escapar(s.resumo || '') + '</span></span>' +
          '<span class="secao-conta">' + feitos + '/' + itens.length + '</span>' +
        '</button>' +
        '<div style="padding:0 15px 10px"><span class="trilho"><span class="cheio" style="width:' + parte + '%"></span></span></div>' +
        (aberta ? '<div class="secao-corpo">' +
          (s.porque ? '<p class="porque">' + escapar(s.porque) + '</p>' : '') +
          itens.map(function(it,i){
            const chave = s.id + '-' + i;
            const marcado = !!dados.marcados[chave];
            return '<div class="item-cl ' + (marcado ? 'pronto' : '') + '">' +
              '<input type="checkbox" id="ck-' + escapar(chave) + '" data-chave="' + escapar(chave) + '"' + (marcado ? ' checked' : '') + '>' +
              '<span><label class="t" for="ck-' + escapar(chave) + '">' + escapar(it.t || '') + '</label>' +
              (it.d ? '<span class="d" style="display:block">' + escapar(it.d) + '</span>' : '') + '</span></div>';
          }).join('') +
        '</div>' : '') +
      '</div>';
    }).join('');

    $('#corpoCl').innerHTML = html;
    ligarAcordeao();
    $$('[data-chave]').forEach(function(ck){
      ck.addEventListener('change', async function(){
        const chave = ck.dataset.chave;
        if (ck.checked){ dados.marcados[chave] = true; } else { delete dados.marcados[chave]; }
        try{
          if (ck.checked){
            const r = await sb.from('marcados').upsert({ chave: chave, marcado: true }, { onConflict:'chave' });
            if (r.error){ throw r.error; }
          } else {
            const r = await sb.from('marcados').delete().eq('chave', chave);
            if (r.error){ throw r.error; }
          }
        }catch(e){
          avisinho('Marquei aqui na tela, mas não consegui salvar no banco.');
        }
        subChecklist();
      });
    });
  }

  function ligarAcordeao(){
    $$('[data-abre]').forEach(function(b){
      b.addEventListener('click', function(){
        const chave = b.dataset.abre;
        abertas[chave] = !abertas[chave];
        desenharChecklist();
      });
    });
  }

  /* pega o código do vídeo do YouTube para montar a capa */
  function idDoYoutube(link){
    const m = String(link||'').match(/(?:shorts\/|watch\?v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : '';
  }

  function subReferencias(){
    const refs = B().REFERENCIAS || [];
    if (!refs.length){ $('#corpoCl').innerHTML = '<p class="vazio">Sem referências no arquivo.</p>'; return; }
    $('#corpoCl').innerHTML = '<div class="grade-ref">' + refs.map(function(r){
      const id = idDoYoutube(r.youtube);
      return '<button class="cartao-ref" type="button" data-ref="' + escapar(r.id) + '">' +
        '<span class="capa-ref">' +
          (id ? '<img src="https://i.ytimg.com/vi/' + escapar(id) + '/maxresdefault.jpg" alt="Capa do vídeo ' + escapar(r.titulo||'') + '" loading="lazy" decoding="async">' : '') +
          '<span class="emoji" aria-hidden="true">' + escapar(r.emoji||'') + '</span>' +
          (r.duracao ? '<span class="dur">' + escapar(r.duracao) + '</span>' : '') +
        '</span>' +
        '<span class="corpo-ref" style="display:block">' +
          '<h4>' + escapar(r.titulo||'') + '</h4>' +
          '<p>' + escapar([r.estilo, r.marca].filter(Boolean).join(' · ')) + '</p>' +
        '</span></button>';
    }).join('') + '</div>';

    $$('[data-ref]').forEach(function(b){
      b.addEventListener('click', function(){
        const r = refs.filter(function(x){ return x.id === b.dataset.ref; })[0];
        if (r){ fichaReferencia(r); }
      });
    });
  }

  function fichaReferencia(r){
    let html = '<div class="ficha">' +
      '<p style="font-size:.8rem;color:var(--tinta-suave)">' +
        escapar([r.estilo, r.audiencia, r.duracao, r.marca].filter(Boolean).join(' · ')) + '</p>';
    if (r.gancho){ html += '<h4>o gancho</h4><p class="destaque-txt">' + escapar(r.gancho) + '</p>'; }
    if (r.porque){ html += '<h4>por que funciona</h4><p>' + escapar(r.porque) + '</p>'; }
    if (r.diferencial){ html += '<h4>o diferencial</h4><p>' + escapar(r.diferencial) + '</p>'; }
    if (r.erro){ html += '<h4>o erro comum</h4><p>' + escapar(r.erro) + '</p>'; }
    if (r.roteiro && r.roteiro.length){
      html += '<h4>o roteiro, bloco por bloco</h4>' + r.roteiro.map(function(b){
        return '<div class="bloco-tempo"><span class="t">' + escapar(b.t||'') + '</span><span class="o">' + (b.o||'') + '</span></div>';
      }).join('');
    }
    html += '</div><div class="janela-pe">' +
      '<button class="botao claro" type="button" data-fechar>Fechar</button>' +
      (r.youtube ? '<a class="botao" href="' + escapar(r.youtube) + '" target="_blank" rel="noopener">assistir</a>' : '') +
      '</div>';
    abrirJanela(r.titulo || 'Referência', html, true);
  }

  function subRoteiros(){
    const tipos = B().TIPOS || [];
    if (!tipos.length){ $('#corpoCl').innerHTML = '<p class="vazio">Sem roteiros no arquivo.</p>'; return; }
    $('#corpoCl').innerHTML = tipos.map(function(t){
      const aberta = !!abertas['tp-' + t.id];
      return '<div class="secao-cl">' +
        '<button class="secao-cabeca" type="button" data-abre="tp-' + escapar(t.id) + '" aria-expanded="' + aberta + '">' +
          '<span class="secao-emoji" aria-hidden="true">' + escapar(t.emoji||'') + '</span>' +
          '<span><span class="secao-nome">' + escapar(t.nome||'') + '</span>' +
          '<span class="secao-resumo" style="display:block">' + escapar(t.duracao||'') + '</span></span>' +
        '</button>' +
        (aberta ? '<div class="secao-corpo">' +
          (t.porque ? '<p class="porque">' + escapar(t.porque) + '</p>' : '') +
          (t.beats||[]).map(function(b){
            return '<div class="bloco-tempo"><span class="t">' + escapar(b.t||'') + '</span><span class="o">' + (b.o||'') + '</span></div>';
          }).join('') +
          (t.erros ? '<h4 style="font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);margin:14px 0 5px">erros comuns</h4>' +
            (Array.isArray(t.erros)
              ? '<ul>' + t.erros.map(function(e){ return '<li style="font-size:.83rem;padding:3px 0">' + escapar(e) + '</li>'; }).join('') + '</ul>'
              : '<p style="font-size:.83rem">' + escapar(t.erros) + '</p>') : '') +
        '</div>' : '') +
      '</div>';
    }).join('');
    ligarAcordeao();
  }

  function subIdeias(){
    const nichos = B().NICHOS || [];
    if (!nichos.length){ $('#corpoCl').innerHTML = '<p class="vazio">Sem ideias no arquivo.</p>'; return; }
    $('#corpoCl').innerHTML = nichos.map(function(n){
      const aberta = !!abertas['ni-' + n.id];
      return '<div class="secao-cl">' +
        '<button class="secao-cabeca" type="button" data-abre="ni-' + escapar(n.id) + '" aria-expanded="' + aberta + '">' +
          '<span class="secao-emoji" aria-hidden="true">' + escapar(n.emoji||'') + '</span>' +
          '<span><span class="secao-nome">' + escapar(n.nome||'') + '</span>' +
          '<span class="secao-resumo" style="display:block">' + (n.ideias||[]).length + ' ideias</span></span>' +
        '</button>' +
        (aberta ? '<div class="secao-corpo">' + (n.ideias||[]).map(function(i){
          return '<div class="ideia"><div class="t">' + escapar(i.t||'') + '</div>' +
                 (i.gancho ? '<div class="g">' + escapar(i.gancho) + '</div>' : '') + '</div>';
        }).join('') + '</div>' : '') +
      '</div>';
    }).join('');
    ligarAcordeao();
  }

  function subRevisao(){
    const blocos = B().REVISAO || [];
    let html = '<div class="caixa"><p class="caixa-titulo">cole aqui o seu roteiro</p>' +
      '<textarea class="roteiro" id="meuRoteiro" placeholder="Cole o roteiro e vá conferindo item por item na lista abaixo."></textarea>' +
      '<p style="font-size:.76rem;color:var(--apagado);margin-top:6px">Este campo é só para você ler enquanto confere. Ele não é salvo em lugar nenhum.</p></div>';

    html += blocos.map(function(b, bi){
      return '<div class="secao-cl"><div class="secao-cabeca" style="cursor:default">' +
          '<span class="secao-emoji" aria-hidden="true">' + escapar(b.emoji||'') + '</span>' +
          '<span class="secao-nome">' + escapar(b.bloco||'') + '</span>' +
        '</div>' +
        '<div class="secao-corpo">' + (b.itens||[]).map(function(it, i){
          const chave = 'rev-' + bi + '-' + i;
          return '<div class="item-cl">' +
            '<input type="checkbox" id="' + chave + '">' +
            '<span><label class="t" for="' + chave + '">' + escapar(it.t||'') + '</label>' +
            (it.d ? '<span class="d" style="display:block">' + escapar(it.d) + '</span>' : '') + '</span></div>';
        }).join('') + '</div></div>';
    }).join('');

    $('#corpoCl').innerHTML = html;
  }

  /* =====================================================================
     COMEÇAR
     ===================================================================== */
  async function começar(){
    $('#emailDona').textContent = (usuario && usuario.email) || window.BANCO.dona;
    await carregarTudo();
    mostrarAvisos();
    $('#carregando').hidden = true;
    $('#app').hidden = false;

    $$('.item').forEach(function(b){
      b.addEventListener('click', function(){ irPara(b.dataset.aba); });
    });
    $('#botaoSair').addEventListener('click', async function(){
      try{ await sb.auth.signOut(); }catch(e){}
      location.replace('../login/');
    });
    $('#botaoGaveta').addEventListener('click', function(){
      const abriu = document.body.classList.toggle('gaveta-aberta');
      $('#fundoGaveta').hidden = !abriu;
    });
    $('#fundoGaveta').addEventListener('click', function(){
      document.body.classList.remove('gaveta-aberta');
      $('#fundoGaveta').hidden = true;
    });

    const inicial = (location.hash || '').replace('#','');
    irPara(ABAS[inicial] ? inicial : 'portfolio');
  }
})();
</script>
</body>
</html>
